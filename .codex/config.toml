[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "KMALUMNOS_CODEX_GITHUB_TOKEN"

[mcp_servers.shadcn]
command = "cmd"
args = ["/c", "npx", "-y", "shadcn@latest", "mcp"]

[mcp_servers.supabase]
command = "cmd"
args = ["/c", "npx", "-y", "@supabase/mcp-server-supabase@latest", "--project-ref=dmwoqugdnwgkcqtixhyw"]
env_vars = ["SUPABASE_ACCESS_TOKEN"]

[mcp_servers.vercel]
url = "https://mcp.vercel.com"
bearer_token_env_var = "KMALUMNOS_CODEX_VERCEL_TOKEN"
