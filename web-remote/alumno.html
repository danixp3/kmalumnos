<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="AulaMovil — Mis prácticas">
<meta property="og:description" content="Consulta tus prácticas de conducción">
<meta name="theme-color" content="#f6f7f9">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo.png">
<title>AulaMovil — Mis prácticas</title>
<style>
  /*
   * Portal del alumno (Fase 0 · Bloque 2, ROADMAP-SAAS.md). Página nueva,
   * autocontenida, que NO toca index.html. Mismo sistema de estilos que
   * index.html (copiado a propósito para no depender de ese archivo).
   *
   * Login por ENLACE MÁGICO de Supabase Auth (reemplaza al antiguo
   * enfoque de "enlace inadivinable" con ?a=<id>&t=<token>, descartado —
   * ver migraciones/2026-08-05_portal_alumno.sql). El alumno escribe su
   * email, recibe un enlace por correo y, al pulsarlo desde ese mismo
   * dispositivo, vuelve a esta misma página ya autenticado: Supabase
   * incluye los tokens de sesión en la URL del enlace y supabase-js los
   * canjea solo (detectSessionInUrl, activado por defecto) al crear el
   * cliente. Se usa signInWithOtp igual que en el antiguo login por
   * código, pero sin verifyOtp: aquí no se teclea nada, solo se pulsa.
   */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-light: #eef2ff;
    --success: #10b981;
    --success-light: #d1fae5;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --text: #101828;
    --text-muted: #667085;
    --border: #e3e6ee;
    --bg: #f6f7f9;
    --card: #ffffff;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 24px);
    padding-top: max(env(safe-area-inset-top), 24px);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 460px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 22px; padding-top: 8px; animation: slideDown .5s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }

  .logo-mark { width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 5px; font-weight: 500; }

  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border);
    animation: slideUp .4s ease-out .05s both;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

  input[type="email"], input[type="text"] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border);
    font-size: 15px; font-family: inherit; color: var(--text); background: #fff;
  }
  input[type="email"]:focus, input[type="text"]:focus { outline: none; border-color: var(--primary); }

  .campo { margin-bottom: 16px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .checkbox-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); }
  .checkbox-row label { margin-bottom: 0; font-weight: 500; color: var(--text); font-size: 13.5px; }

  .btn {
    width: 100%; padding: 13px 16px; border-radius: 12px; border: none; font-size: 15px;
    font-weight: 700; font-family: inherit; cursor: pointer; background: var(--primary); color: #fff;
    transition: background .15s ease;
  }
  .btn:hover:not(:disabled) { background: var(--primary-dark); }
  .btn:disabled { opacity: .6; cursor: default; }

  .btn-link {
    width: 100%; padding: 10px; border: none; background: none; color: var(--primary);
    font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 6px;
  }
  .btn-link:disabled { opacity: .5; cursor: default; }

  .alumno-nombre { font-size: 18px; font-weight: 800; }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 7px; font-size: 12px; font-weight: 700;
    background: #e0e7ff; color: #4338ca; margin-left: 6px; border: 1px solid rgba(67,56,202,.12);
  }
  .total-badge {
    display: inline-block; margin-top: 10px; font-size: 12.5px; font-weight: 700;
    color: var(--text-muted); background: #f2f4f7; border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 99px;
  }

  .historial-item {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    padding: 14px 16px; margin-bottom: 10px; animation: listaIn .32s ease both;
  }
  @keyframes listaIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .historial-item:nth-child(n+6) { animation-delay: .18s; }

  .historial-fecha { font-weight: 700; font-size: 14.5px; }
  .historial-detalle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .historial-nota { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
  .historial-empty { text-align: center; color: var(--text-muted); padding: 34px 16px; font-size: 14px; }

  .estado-carga { text-align: center; padding: 60px 16px; color: var(--text-muted); }
  .loading-dots span { display: inline-block; animation: bounce .6s infinite; font-size: 22px; }
  .loading-dots span:nth-child(2) { animation-delay: .1s; }
  .loading-dots span:nth-child(3) { animation-delay: .2s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  .msg-error {
    background: var(--danger-light); border: 1.5px solid #fecaca; border-radius: 12px;
    padding: 10px 14px; font-size: 13px; color: #b91c1c; margin-bottom: 14px; font-weight: 500;
  }
  .msg-ok {
    background: var(--success-light); border: 1.5px solid #a7f3d0; border-radius: 12px;
    padding: 10px 14px; font-size: 13px; color: #047857; margin-bottom: 14px; font-weight: 500;
  }

  .estado-error {
    background: var(--danger-light); border: 1.5px solid #fecaca; border-radius: var(--radius);
    padding: 26px 22px; text-align: center; animation: popIn .35s cubic-bezier(.17,.67,.35,1.5);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  .estado-error .titulo { font-size: 16px; font-weight: 700; color: #dc2626; margin-bottom: 6px; }
  .estado-error .msg { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }

  .btn-cerrar-sesion {
    width: 100%; padding: 11px; border-radius: 12px; border: 1.5px solid var(--border);
    background: #fff; color: var(--text-muted); font-size: 13.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; margin-top: 8px;
  }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, .header, .card, .historial-item, .estado-error { animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="logo-mark">
      <img src="/logo.png" alt="AulaMovil" style="width:100%;height:100%;object-fit:contain">
    </div>
    <h1>Mis prácticas</h1>
    <p class="subtitle">AulaMovil · Portal del alumno</p>
  </div>

  <!-- Comprobación inicial de sesión guardada (localStorage de una visita anterior con "recordar" activado). -->
  <div id="estado-carga-inicial" class="estado-carga">
    <div class="loading-dots"><span>●</span><span>●</span><span>●</span></div>
    <p style="margin-top:10px;font-size:13.5px">Comprobando tu sesión…</p>
  </div>

  <!-- PASO 1: identificarse con el email -->
  <div id="paso-email" class="card hidden">
    <div id="paso-email-msg"></div>
    <div class="campo">
      <label for="input-email">Tu email</label>
      <input type="email" id="input-email" placeholder="tu-email@ejemplo.com" autocomplete="email">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="input-recordar" checked>
      <label for="input-recordar">Recordar sesión en este dispositivo</label>
    </div>
    <button class="btn" id="btn-enviar-codigo" onclick="solicitarCodigo()">Enviar enlace de acceso</button>
  </div>

  <!-- PASO 2: informativo, esperando a que el alumno pulse el enlace del email -->
  <div id="paso-codigo" class="card hidden">
    <div id="paso-codigo-msg"></div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px">
      Te hemos enviado un enlace de acceso a <strong id="paso-codigo-email"></strong>.
      Ábrelo desde tu correo <strong>en este mismo dispositivo/navegador</strong> y entrarás automáticamente.
    </p>
    <button class="btn-link" id="btn-reenviar-codigo" onclick="solicitarCodigo()">Reenviar enlace</button>
    <button class="btn-link" onclick="volverAPasoEmail()">‹ Volver</button>
  </div>

  <!-- Carga de datos al volver desde el enlace o al recuperar sesión guardada -->
  <div id="estado-carga-datos" class="estado-carga hidden">
    <div class="loading-dots"><span>●</span><span>●</span><span>●</span></div>
    <p style="margin-top:10px;font-size:13.5px">Cargando tus prácticas…</p>
  </div>

  <div id="estado-error-datos" class="estado-error hidden">
    <div class="titulo">No se han podido cargar tus datos</div>
    <div class="msg" id="estado-error-datos-msg"></div>
  </div>

  <!-- PASO 3: mis prácticas -->
  <div id="paso-datos" class="hidden">
    <div class="card">
      <div class="alumno-nombre" id="alumno-nombre"></div>
      <span class="total-badge" id="alumno-total"></span>
    </div>
    <div id="lista-practicas"></div>
    <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<script type="module">
  // Solo lectura salvo el propio login: esta página no envía ningún
  // dato de prácticas, solo consulta.
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  const SUPABASE_URL = 'https://dmwoqugdnwgkcqtixhyw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtd29xdWdkbndna2NxdGl4aHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjA5NjYsImV4cCI6MjA5OTU5Njk2Nn0.8XhWdS0ohrCbZcKpHWKsJz22rY8ASA4IkgpbtE_pHkc';

  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');

  // "Recordar sesión" — en v1 el checkbox se deja visible por coherencia
  // visual, pero NO cambia el comportamiento: el retorno desde el enlace
  // mágico es siempre una carga nueva de página (el alumno llega desde su
  // cliente de correo), así que no hay forma de "recordar la elección del
  // checkbox" entre el paso 1 y ese momento. Por eso el cliente de
  // supabase-js se crea SIEMPRE con el storage por defecto (localStorage,
  // persistSession activado): la sesión persiste tras pulsar el enlace,
  // sin distinguir el estado del checkbox. Complicarlo con sessionStorage
  // exigiría coordinar el paso 1 (donde se marca "recordar") con la carga
  // de página que abre el enlace (un contexto de JS distinto), lo cual
  // queda fuera de v1.
  // flowType 'implicit' a juego con el endpoint que genera el enlace: los
  // tokens llegan en el fragmento de la URL y detectSessionInUrl (activado
  // por defecto) los canjea al crear el cliente, sin necesitar code_verifier.
  let supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit' } });
  let emailActual = '';

  function mostrarPaso(paso) {
    ['estado-carga-inicial', 'paso-email', 'paso-codigo', 'estado-carga-datos', 'estado-error-datos', 'paso-datos']
      .forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById(paso).classList.remove('hidden');
  }

  function mostrarMensaje(contenedorId, texto, tipo) {
    const el = document.getElementById(contenedorId);
    if (!texto) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="${tipo === 'error' ? 'msg-error' : 'msg-ok'}">${escapeHtml(texto)}</div>`;
  }

  function volverAPasoEmail() {
    mostrarMensaje('paso-codigo-msg', '');
    mostrarPaso('paso-email');
  }
  window.volverAPasoEmail = volverAPasoEmail;

  async function solicitarCodigo() {
    // Este botón se usa tanto en el paso 1 ("Enviar enlace de acceso")
    // como en el paso 2 ("Reenviar enlace"): en el paso 1 lee el email
    // del input; en el paso 2 reutiliza emailActual. El "recordar" del
    // checkbox no cambia el cliente (ver comentario de arriba), solo se
    // deja el input visible por coherencia.
    const enPasoEmail = !document.getElementById('paso-email').classList.contains('hidden');
    let email;

    if (enPasoEmail) {
      email = document.getElementById('input-email').value.trim();
      if (!email) {
        mostrarMensaje('paso-email-msg', 'Escribe tu email.', 'error');
        return;
      }
      emailActual = email;
    } else {
      email = emailActual;
    }

    const btnId = enPasoEmail ? 'btn-enviar-codigo' : 'btn-reenviar-codigo';
    const msgId = enPasoEmail ? 'paso-email-msg' : 'paso-codigo-msg';
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    const textoOriginal = btn.textContent;
    btn.textContent = 'Enviando…';
    mostrarMensaje(msgId, '');

    try {
      const res = await fetch('/api/alumno-solicitar-codigo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json().catch(() => ({}));

      if (res.status === 503) {
        mostrarMensaje(msgId, 'El portal aún no está disponible. Inténtalo más tarde.', 'error');
        return;
      }
      if (!res.ok || !data.ok) {
        mostrarMensaje(msgId, data.error || 'No se ha podido enviar el enlace.', 'error');
        return;
      }

      if (enPasoEmail) {
        document.getElementById('paso-codigo-email').textContent = emailActual;
        mostrarMensaje('paso-codigo-msg', data.msg, 'ok');
        mostrarPaso('paso-codigo');
      } else {
        mostrarMensaje('paso-codigo-msg', data.msg, 'ok');
      }
    } catch (e) {
      mostrarMensaje(msgId, 'No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }
  window.solicitarCodigo = solicitarCodigo;

  function mostrarErrorDatos(msg) {
    mostrarPaso('estado-error-datos');
    document.getElementById('estado-error-datos-msg').textContent = msg;
  }

  function mostrarDatos(data) {
    mostrarPaso('paso-datos');

    document.getElementById('alumno-nombre').innerHTML =
      escapeHtml(data.alumno.nombre) + (data.alumno.permiso ? `<span class="tag">${escapeHtml(data.alumno.permiso)}</span>` : '');
    document.getElementById('alumno-total').textContent =
      data.total + (data.total === 1 ? ' práctica registrada' : ' prácticas registradas');

    const listEl = document.getElementById('lista-practicas');
    if (!data.practicas || !data.practicas.length) {
      listEl.innerHTML = '<div class="historial-empty">Todavía no tienes prácticas registradas.</div>';
      return;
    }

    listEl.innerHTML = data.practicas.map(p => {
      const tipoTxt = p.tipo === 'pista' ? 'Pista' : 'Circulación';
      const tieneKm = (p.km_final != null && p.km_inicial != null) && (p.km_final > 0 || p.km_inicial > 0);
      const kmTxt = tieneKm ? (Math.max(0, p.km_final - p.km_inicial) + ' km') : 'Km pendientes';
      const partes = [kmTxt];
      if (p.profesor_nombre) partes.push(escapeHtml(p.profesor_nombre));
      const fechaFmt = typeof p.fecha === 'string' ? p.fecha.split('-').reverse().join('/') : '';
      return `
        <div class="historial-item">
          <div class="historial-fecha">${escapeHtml(fechaFmt)} <span class="tag">${escapeHtml(tipoTxt)}</span></div>
          <div class="historial-detalle">${partes.join(' · ')}</div>
          ${p.nota ? `<div class="historial-nota">${escapeHtml(p.nota)}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  async function cargarDatos() {
    mostrarPaso('estado-carga-datos');

    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        mostrarErrorDatos('Tu sesión no es válida. Vuelve a iniciar sesión.');
        return;
      }

      const res = await fetch('/api/alumno-mis-datos', {
        headers: { Authorization: 'Bearer ' + session.access_token }
      });
      const data = await res.json().catch(() => ({}));

      if (res.status === 503) {
        mostrarErrorDatos('El portal aún no está disponible. Inténtalo más tarde.');
        return;
      }
      if (res.status === 401) {
        mostrarErrorDatos('Tu sesión ha caducado. Vuelve a iniciar sesión.');
        return;
      }
      if (!res.ok || !data.ok) {
        mostrarErrorDatos(data.error || 'No se han podido cargar tus prácticas.');
        return;
      }

      mostrarDatos(data);
    } catch (e) {
      mostrarErrorDatos('No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.');
    }
  }
  window.cargarDatos = cargarDatos;

  async function cerrarSesion() {
    if (supabaseClient) {
      try { await supabaseClient.auth.signOut(); } catch (e) { /* seguimos igual */ }
    }
    emailActual = '';
    document.getElementById('input-email').value = '';
    document.getElementById('input-recordar').checked = true;
    mostrarMensaje('paso-email-msg', '');
    mostrarMensaje('paso-codigo-msg', '');
    mostrarPaso('paso-email');
  }
  window.cerrarSesion = cerrarSesion;

  async function arrancar() {
    // El cliente de supabase-js ya está creado (con detectSessionInUrl
    // activado por defecto): si la página se abrió desde el enlace del
    // correo, los tokens venían en el fragmento de la URL y ya se han
    // canjeado a estas alturas, así que getSession() los devuelve. Si no
    // hay tokens en la URL, getSession() devuelve la sesión guardada de
    // una visita anterior (localStorage) o ninguna.
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        emailActual = session.user && session.user.email ? session.user.email : '';
        await cargarDatos();
        return;
      }
    } catch (e) {
      // Si algo falla comprobando la sesión, seguimos igual al paso 1: no
      // es un error bloqueante, el usuario puede iniciar sesión de nuevo.
    }
    mostrarPaso('paso-email');
  }

  arrancar();
</script>
</body>
</html>
