<script>/* Tema antes de pintar (Perfil → Apariencia; «Automático» sigue al teléfono) */
try { var t = localStorage.getItem('km_tema'); if (t !== 'claro' && t !== 'oscuro' && t !== 'negro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'; if (t !== 'claro') document.documentElement.dataset.tema = t; } catch (e) {}</script>

  /* ── TOKENS (mismo sistema visual que la app de escritorio) ──
     --ink: texto y marcas de contraste (en los temas oscuros pasa a claro);
     --on-ink: texto sobre un fondo --ink; --oscura: tarjetas que son oscuras
     en todos los temas («Ahora», avatar); --campo/--boton/--resalte/--barra:
     superficies que en el tema claro son blancas. */
  :root {
    --ink: #14161B; --on-ink: #FFFFFF; --oscura: #14161B; --curso-bg: #14161B; --sobre-ambar: #14161B;
    --bg: #F3F2EE; --hoja: #F3F2EE; --card: #FFFFFF; --campo: #FFFFFF; --boton: #FFFFFF; --resalte: #FFFFFF; --barra: #FFFFFF;
    --line: #E3E1DB; --line-2: #D6D3CC; --soft: #EEECE7;
    --muted: #5E6068; --muted-2: #3A3D45; --faint: #6B6E76;
    --amber: #FFB81C; --amber-strong: #E09A00; --amber-ink: #8A5800; --amber-soft: #FFF3D1;
    --ok: #1D6B4F; --ok-soft: #E2F1E9; --err: #B42318; --err-soft: #FDECEA; --info: #1E4FB8; --info-soft: #E7EDFB;
    color-scheme: light;
    --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --tab-h: 68px;
  }
  /* Temas oscuros (como en el escritorio). La hoja que se abre sobre «En curso»
     (pantalla siempre oscura) usa también estos colores: antes heredaba el texto
     claro de la pantalla sobre su fondo claro y no se leía. */
  :root[data-tema="oscuro"], body.oscuro .hoja {
    --ink: #F3F2EE; --on-ink: #14161B; --oscura: #22252C; --curso-bg: #14161B;
    --bg: #14161B; --hoja: #1A1D23; --card: #1E2027; --campo: #171A20; --boton: #1E2027; --resalte: #3F434D; --barra: #1B1E25;
    --line: #2F323B; --line-2: #3F434D; --soft: #2A2D35;
    --muted: #A3A6AE; --muted-2: #C9CBD1; --faint: #8C8F97;
    --amber-ink: #FFCF5C; --amber-soft: #33290F;
    --ok: #6EE7B7; --ok-soft: #10301F; --err: #FCA5A5; --err-soft: #3A1518; --info: #B7C8F5; --info-soft: #1A2444;
    color-scheme: dark;
  }
  :root[data-tema="negro"], :root[data-tema="negro"] body.oscuro .hoja {
    --ink: #F5F5F5; --on-ink: #000000; --oscura: #141414; --curso-bg: #000000;
    --bg: #000000; --hoja: #0B0B0B; --card: #0D0D0D; --campo: #0A0A0A; --boton: #0D0D0D; --resalte: #2E2E2E; --barra: #0A0A0A;
    --line: #262626; --line-2: #333333; --soft: #1C1C1C;
    --muted: #A3A3A3; --muted-2: #D4D4D4; --faint: #8A8A8A;
    --amber-ink: #FFCF5C; --amber-soft: #241C08;
    --ok: #4ADE80; --ok-soft: #0A2318; --err: #F87171; --err-soft: #2A0F12; --info: #A5BAF0; --info-soft: #10172E;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100dvh; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; font-size: 16px; line-height: 1.35; }
  body.oscuro { background: var(--curso-bg); color: #F3F2EE; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  /* Sin el retraso ni el zoom del doble toque: un botón responde al primer toque */
  button, a, label, select, summary, input[type=checkbox], input[type=radio] { touch-action: manipulation; }
  input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); font-weight: 500; }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── PANTALLAS DE ACCESO ── */
  .acceso { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; gap: 22px; }
  .acceso-marca { display: flex; align-items: center; gap: 12px; }
  .acceso-marca .logo { width: 52px; height: 52px; border-radius: 14px; background: #fff; padding: 4px; box-shadow: 0 0 0 3px var(--amber); }
  .acceso-marca .logo img { width: 100%; height: 100%; object-fit: contain; }
  .acceso-marca h1 { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
  .acceso h2 { font-family: var(--font-display); font-size: 30px; font-weight: 700; }
  .acceso-sub { color: var(--muted); font-size: 16px; text-align: center; }
  .acceso-card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .campo { width: 100%; height: 52px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--campo); outline: none; }
  .campo:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20,22,27,.12); }
  textarea.campo { height: auto; min-height: 92px; padding: 12px 14px; resize: vertical; }
  .err-txt { color: var(--err); font-size: 14px; min-height: 18px; font-weight: 600; }
  .aviso-dni { color: var(--err); font-size: 13px; margin-top: 4px; line-height: 1.3; }
  .acceso-legal { margin-top: 22px; font-size: 13px; color: var(--muted, #5E6068); text-align: center; }
  .acceso-legal a { color: inherit; }
  .firma-legal { margin: 6px 2px 0; font-size: 13px; color: var(--muted, #5E6068); line-height: 1.35; }
  .firma-legal a { color: inherit; }
  .aviso-dni:empty { display: none; }
  .aviso-dni .lnk { font-size: 13px; padding: 0 2px; color: inherit; }
  .campo.campo-mal { border-color: var(--err); }
  .perfil-op { width: 100%; max-width: 360px; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 18px; font-weight: 600; text-align: left; }
  .perfil-op:active { background: var(--soft); }
  .perfil-op .chev { margin-left: auto; color: var(--faint); }

  /* ── BOTONES ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid transparent; font-size: 17px; font-weight: 700; width: 100%; }
  .btn-pri { background: var(--amber); color: var(--sobre-ambar); }
  .btn-pri:active { background: var(--amber-strong); }
  .btn-pri[disabled] { background: var(--soft); color: #8C8F97; cursor: default; }
  .btn-sec { background: var(--boton); border-color: var(--line-2); color: var(--ink); }
  .btn-osc { background: var(--ink); color: var(--on-ink); }
  .btn-peq { height: 40px; width: auto; padding: 0 14px; font-size: 15px; border-radius: 10px; }
  .btn-lg { height: 60px; font-size: 19px; border-radius: 16px; }
  .lnk { background: none; border: none; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; font-size: 15px; padding: 6px 2px; }
  .lnk-suave { color: var(--muted); font-weight: 500; }

  /* ── VISTAS ── */
  #app { min-height: 100dvh; }
  /* Modo sin conexión: franja fina arriba con el estado (sin cobertura / pendientes de enviar) */
  #estado-red { position: fixed; top: 0; left: 0; right: 0; z-index: 70; display: flex; align-items: center; justify-content: center; gap: 8px; padding: env(safe-area-inset-top) 12px 0; height: calc(30px + env(safe-area-inset-top)); font-size: 14px; font-weight: 700; cursor: pointer; background: var(--ink); color: var(--on-ink); }
  #estado-red[hidden] { display: none; }
  #estado-red.sin { background: var(--amber); color: #14161B; }
  #estado-red.pend { background: var(--info); color: #fff; }
  #estado-red.err { background: var(--err); color: #fff; }
  #estado-red .punto { width: 8px; height: 8px; border-radius: 99px; background: currentColor; flex: none; }
  body.con-estado #app { padding-top: calc(30px + env(safe-area-inset-top)); }
  @media (min-width: 900px) { body.con-estado #riel { top: calc(30px + env(safe-area-inset-top)); height: calc(100dvh - 30px - env(safe-area-inset-top)); } }
  .op-fila { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--soft); }
  .op-fila:last-child { border-bottom: 0; }
  .op-fila .op-acc { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .op-err { color: var(--err); font-size: 14px; font-weight: 600; margin-top: 4px; }
  .vista { display: none; padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; animation: entra .22s ease; }
  .vista.on { display: block; }
  .vista.sin-tab { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .cab-tit { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cab-tit h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1; }
  .cab-atras { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; flex-shrink: 0; }
  .fecha-lin { font-size: 15px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .fecha-lin button { background: none; border: none; color: var(--muted); padding: 12px 14px; margin: -12px -6px; display: inline-flex; border-radius: 12px; }
  .fecha-lin button:active { background: var(--soft); color: var(--ink); transform: scale(.92); }
  .grande { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; }
  .avatar { width: 44px; height: 44px; border-radius: 999px; background: var(--oscura); color: var(--amber); border: none; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 19px; font-weight: 700; flex-shrink: 0; }
  .ini { width: 44px; height: 44px; border-radius: 999px; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .ini-lg { width: 62px; height: 62px; background: var(--amber); color: var(--sobre-ambar); font-size: 26px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .card-pad { padding: 14px 16px; }
  .fila { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--soft); background: none; border-left: none; border-right: none; border-bottom: none; width: 100%; text-align: left; }
  .fila:first-child { border-top: none; }
  .fila-sub { font-size: 14px; color: var(--muted); }
  .fila-sub.mono { font-size: 13.5px; }
  .fila-tit { font-size: 16.5px; font-weight: 600; }
  .fila-hora { font-family: var(--font-mono); font-size: 15px; color: var(--muted); width: 50px; flex-shrink: 0; }
  .grupo-tit { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .grupo-tit a, .grupo-tit button { background: none; border: none; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }

  /* placa */
  .placa { display: inline-flex; align-items: stretch; height: 24px; border: 1.5px solid #14161B; border-radius: 4px; overflow: hidden; background: #fff; color: #14161B; flex-shrink: 0; vertical-align: middle; }
  .placa-e { width: 11px; padding-bottom: 2px; background: #1D3F9E; color: #fff; font-size: 7px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; }
  .placa-n { padding: 0 7px; display: flex; align-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }

  /* pastillas */
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--muted-2); white-space: nowrap; }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-warn { background: var(--amber-soft); color: var(--amber-ink); }
  .pill-err { background: var(--err-soft); color: var(--err); }
  .pill-info { background: var(--info-soft); color: var(--info); }
  .pill-dark { background: var(--ink); color: var(--on-ink); }
  .pill-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--amber); }

  /* barra de progreso segmentada */
  .segs { display: flex; gap: 5px; margin: 8px 0 4px; }
  .segs i { flex: 1; height: 7px; border-radius: 999px; background: var(--line-2); }
  .segs i.hecha { background: var(--ink); }
  .segs i.curso { background: var(--amber); }
  .prog-lin { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; font-weight: 600; }
  .prog-lin b { font-family: var(--font-mono); font-weight: 600; }

  /* tarjeta AHORA */
  .ahora { background: var(--oscura); color: #F3F2EE; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .ahora-cab { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 15px; color: #C9CBD1; }
  .ahora-et { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--amber); }
  .ahora-quien { display: flex; align-items: center; gap: 12px; }
  .ahora-quien .ini { background: #2A2D35; color: #F3F2EE; width: 50px; height: 50px; }
  .ahora-nom { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; }
  .ahora-sub { font-size: 15px; color: #A3A6AE; }

  /* vehículo actual */
  .veh-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .veh-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── INICIAR PRÁCTICA ── */
  .odo-wrap { position: relative; }
  .odo { display: flex; align-items: center; gap: 12px; }
  .odo-cajas { display: flex; gap: 6px; padding: 8px; background: #1E2027; border-radius: 14px; }
  .odo-cajas span { width: 40px; height: 58px; border-radius: 8px; background: #2B2E36; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 34px; font-weight: 600; }
  .odo-cajas span.cero { color: #5A5E68; }
  .odo-km { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
  .odo-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 15px; margin-top: 12px; }
  .msg-ok { background: var(--ok-soft); color: var(--ok); }
  .msg-warn { background: var(--amber-soft); color: var(--amber-ink); }
  .msg-err { background: var(--err-soft); color: var(--err); }
  .msg-gris { background: var(--soft); color: var(--muted-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { height: 48px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--boton); font-size: 16.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .chips-osc .chip { background: transparent; border-color: #4A4E58; color: #F3F2EE; }
  .chips-osc .chip.on { background: var(--amber); color: var(--sobre-ambar); border-color: var(--amber); }
  .seg3 { display: flex; padding: 4px; background: var(--soft); border-radius: 14px; gap: 2px; }
  .seg3 button { flex: 1; height: 44px; border: none; border-radius: 10px; background: transparent; font-size: 16.5px; font-weight: 600; color: var(--muted-2); }
  .seg3 button.on { background: var(--resalte); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(20,22,27,.16); }
  .seg3.dos-lineas button { height: 56px; line-height: 1.15; }
  .instalar-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px 14px; }
  .instalar-card img { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
  .instalar-card .btn { flex-shrink: 0; }
  .instalar-pasos { margin: 6px 0 0; padding-left: 22px; font-size: 16px; line-height: 1.7; }
  .instalar-pasos b { white-space: nowrap; }
  .seg3 button small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .nclases { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 8px 8px 8px 16px; }
  .cant { margin-top: 10px; padding: 10px; }
  .cant .nclases { margin-top: 8px; padding: 2px 0 2px 6px; }
  .cant-frac { margin-top: 10px; }
  .cant-frac button { font-size: 19px; }
  .cant-min { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .cant-min .campo { flex: 1; font-family: var(--font-mono, monospace); font-size: 28px; font-weight: 600; text-align: right; }
  .cant-min span { font-size: 18px; font-weight: 600; color: var(--muted); }
  .paso-n { display: flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 14px; padding: 4px; flex-shrink: 0; }
  .paso-n button { width: 42px; height: 42px; border: none; border-radius: 10px; background: var(--resalte); font-size: 24px; font-weight: 600; color: var(--ink); box-shadow: 0 1px 2px rgba(20,22,27,.14); }
  .paso-n button:disabled { opacity: .35; box-shadow: none; }
  .paso-n b { min-width: 30px; text-align: center; font-size: 22px; font-family: var(--font-mono, monospace); }
  .etq { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .etq small { font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; }
  /* Anotar clase pasada */
  .dias-fila { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
  .dias-fila::-webkit-scrollbar { display: none; }
  .dias-fila .chip { flex-shrink: 0; height: 58px; padding: 0 14px; flex-direction: column; justify-content: center; gap: 1px; line-height: 1.1; position: relative; }
  .dias-fila .chip small { font-size: 12.5px; font-weight: 500; opacity: .75; }
  .dias-fila .chip input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .km-par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .km-par .campo { font-family: var(--font-mono, monospace); font-size: 20px; font-weight: 600; }
  .km-par .etq2 { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .par-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
  .lnk-olvido { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 18px; }
  .barra-fija { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 20; }
  .barra-fija > * { max-width: 528px; margin: 0 auto; }
  body.oscuro .barra-fija { background: linear-gradient(to top, var(--curso-bg) 70%, transparent); }

  /* ── EN CURSO (oscura) ── */
  .curso-et { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: #2B2417; color: var(--amber); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
  .crono { font-family: var(--font-display); font-size: 116px; font-weight: 700; line-height: .95; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; margin: 18px 0 8px; }
  .crono small { font-size: 34px; color: #A3A6AE; font-weight: 600; }
  .crono.pasado { color: var(--amber); }
  .crono.pausado, .crono.pausado small { color: #6B6E76; }
  .curso-et.pausa { background: #2A2D35; color: #C9CBD1; }
  .pausa-lin { margin-top: 10px; font-size: 15px; color: #C9CBD1; display: flex; align-items: center; gap: 8px; }
  .acciones-curso { display: flex; gap: 10px; }
  .acciones-curso .btn-lg { flex: 1; }
  .acciones-curso .btn-pausa { flex: 0 0 auto; width: auto; padding: 0 18px; background: transparent; border: 1.5px solid #4A4E58; color: #F3F2EE; }
  .acciones-curso .btn-sec-osc { flex: 0 0 auto; width: auto; padding: 0 18px; background: transparent; border: 1.5px solid #4A4E58; color: #F3F2EE; }
  .barra-tiempo { height: 8px; border-radius: 999px; background: #2B2E36; overflow: hidden; }
  .barra-tiempo i { display: block; height: 100%; background: var(--amber); border-radius: 999px; transition: width 1s linear; }
  .curso-horas { display: flex; justify-content: space-between; font-size: 15px; color: #A3A6AE; margin-top: 8px; }
  .curso-horas b { color: #F3F2EE; font-family: var(--font-mono); font-weight: 600; }
  .mini2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .mini { background: #1E2027; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .mini .etq2 { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; color: #A3A6AE; }
  .mini .val { font-family: var(--font-mono); font-size: 24px; font-weight: 600; }
  .dash-btn { width: 100%; height: 52px; border-radius: 14px; border: 1.5px dashed #4A4E58; background: transparent; color: #F3F2EE; font-size: 16.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
  .obs-area { width: 100%; margin-top: 16px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #4A4E58; background: #1E2027; color: #F3F2EE; min-height: 96px; font-size: 16px; }

  /* ── TECLADO KM FINAL ── */
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .teclado button { height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--boton); font-size: 26px; font-weight: 600; font-family: var(--font); }
  .teclado button.f { background: var(--soft); font-size: 16px; }
  .teclado button:active { background: var(--soft); }
  .dos-col { display: grid; grid-template-columns: 1fr 1.05fr; gap: 10px; margin-top: 12px; }
  .stat-box { background: var(--soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .stat-box.osc { background: var(--oscura); color: #fff; }
  .stat-box .etq2 { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stat-box.osc .etq2 { color: #A3A6AE; }
  .stat-box .val { font-family: var(--font-mono); font-size: 24px; font-weight: 600; }
  .stat-box.osc .val { color: var(--amber); }

  /* ── FIRMA ── */
  .rev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; padding: 16px; }
  .rev-grid .etq2 { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .rev-grid .val { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .rev-grid .val.mono { font-size: 17px; }
  .firma-caja { position: relative; height: 230px; border: 2px dashed var(--line-2); border-radius: 18px; background: #fff; touch-action: none; overflow: hidden; }
  .firma-caja canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .firma-guia { position: absolute; left: 16px; right: 16px; bottom: 44px; border-bottom: 1.5px solid var(--line-2); pointer-events: none; }
  .firma-guia span { position: absolute; left: 0; bottom: 4px; color: var(--faint); font-size: 22px; }
  .firma-ayuda { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 18px; pointer-events: none; }
  .aviso-entrega { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--amber-ink); }

  /* ── ALUMNOS / FICHA ── */
  .buscar { position: relative; margin-bottom: 12px; }
  .buscar svg { position: absolute; left: 14px; top: 15px; color: var(--muted); }
  .buscar input { padding-left: 42px; }
  .fila-alumno { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--soft); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .fila-alumno:first-child { border-top: none; }
  .fila-alumno .fila-tit { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tres .stat-box { padding: 12px; }
  .tres .val { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
  .tres .stat-box .etq2 { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; }
  .tres .stat-box.osc .etq2 { color: #C9CBD1; }
  .tres .stat-box.osc .val { color: #fff; }
  .cal { padding: 14px; }
  .cal-cab { display: flex; align-items: center; justify-content: space-between; }
  .cal-cab b { font-family: var(--font-display); font-size: 21px; }
  .cal-cab button { width: 40px; height: 40px; border-radius: 10px; border: none; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; }
  .cal-sem, .cal-dias { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-top: 8px; row-gap: 6px; }
  .cal-sem span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .cal-dias span { width: 34px; height: 34px; line-height: 34px; margin: 0 auto; border-radius: 999px; font-size: 15px; color: var(--muted-2); }
  .cal-dias span.hecha { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .cal-dias span.hoy { box-shadow: 0 0 0 2px var(--amber); }
  .cal-dias span.prox { box-shadow: inset 0 0 0 1.5px var(--ink); font-weight: 700; color: var(--ink); }
  .leyenda { display: flex; gap: 14px; font-size: 13.5px; color: var(--muted); margin-top: 10px; align-items: center; }
  .leyenda i { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 5px; }

  /* ── HOJAS / TOAST ── */
  .fondo { position: fixed; inset: 0; background: rgba(20,22,27,.5); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .hoja { width: 100%; max-width: 560px; max-height: 84dvh; background: var(--hoja); color: var(--ink); border-radius: 22px 22px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: sube .22s ease; }
  :root[data-tema] .fondo, body.oscuro .fondo { background: rgba(0,0,0,.62); }
  :root[data-tema] .hoja, body.oscuro .hoja { box-shadow: 0 -1px 0 var(--line-2); }
  @keyframes sube { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .hoja-tit { display: flex; align-items: center; justify-content: space-between; }
  .hoja-tit h3 { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
  .hoja-lista { overflow-y: auto; border-radius: 16px; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 12px 18px; border-radius: 999px; font-size: 15.5px; font-weight: 600; z-index: 80; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(20,22,27,.3); }
  body.oscuro #toast { bottom: 96px; background: #F3F2EE; color: #14161B; }
  .vacio { text-align: center; color: var(--muted); padding: 26px 14px; font-size: 16px; }
  .vacio small { display: block; margin-top: 4px; color: var(--faint); font-size: 14px; }
  .cargando { text-align: center; color: var(--muted); padding: 24px; }
  /* Mientras llega el día que se acaba de pedir: filas grises que laten (Hoy se pinta al instante) */
  .esqueleto { display: grid; gap: 10px; margin-top: 18px; }
  .esqueleto i { display: block; height: 62px; border-radius: 16px; background: var(--soft); animation: latido 1s ease-in-out infinite alternate; }
  .esqueleto i:nth-child(2) { animation-delay: .15s; } .esqueleto i:nth-child(3) { animation-delay: .3s; }
  @keyframes latido { from { opacity: .45; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .esqueleto i { animation: none; } }

  /* ── HISTORIAL EN CALENDARIO ── */
  .cal-hist .cal-dias { row-gap: 4px; column-gap: 2px; }
  .cal-hist .cal-dias button.dia { width: 100%; max-width: 50px; height: 50px; margin: 0 auto; border: none; background: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 15px; color: var(--muted-2); }
  .cal-hist .cal-dias button.dia b { font-weight: 600; line-height: 1; }
  .cal-hist .cal-dias button.dia.con { color: var(--ink); background: var(--soft); }
  .cal-hist .cal-dias button.dia.con b { font-weight: 800; }
  .cal-hist .cal-dias button.dia i { font-style: normal; font-size: 11px; font-weight: 700; min-width: 18px; height: 16px; line-height: 16px; border-radius: 999px; background: var(--ink); color: var(--on-ink); padding: 0 5px; }
  .cal-hist .cal-dias button.dia i.pend { background: var(--amber); color: var(--sobre-ambar); }
  .cal-hist .cal-dias button.dia.hoy { box-shadow: inset 0 0 0 2px var(--amber); }
  .cal-hist .cal-dias button.dia.sel { background: var(--ink); color: var(--on-ink); }
  .cal-hist .cal-dias button.dia.sel i { background: var(--on-ink); color: var(--ink); }
  .cal-hist .cal-dias button.dia.sel i.pend { background: var(--amber); color: var(--sobre-ambar); }
  .firma-vista { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; justify-content: center; }
  .firma-vista img { max-width: 100%; max-height: 180px; }
  .hoja-scroll { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }

  /* ── BARRA INFERIOR ── */
  #tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--barra); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 1.2fr 1fr 1fr; z-index: 30; }
  #tabbar button { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; font-weight: 600; color: var(--muted); }
  #tabbar button.on { color: var(--ink); font-weight: 700; }
  #tabbar .mas { position: relative; }
  #tabbar .mas .circ { width: 60px; height: 60px; border-radius: 999px; background: var(--amber); color: var(--sobre-ambar); display: inline-flex; align-items: center; justify-content: center; margin-top: -30px; box-shadow: 0 6px 16px rgba(224,154,0,.4), 0 0 0 5px var(--barra); }
  #tabbar .mas span.tx { color: var(--ink); font-weight: 700; }

  /* ── TABLET (≥ 900px): jornada a la izquierda, trabajo a la derecha ── */
  #riel { display: none; }
  @media (min-width: 900px) {
    #app.on-app { display: grid; grid-template-columns: 340px minmax(0, 1fr); }
    #riel { display: flex; flex-direction: column; background: var(--barra); border-right: 1px solid var(--line); height: 100dvh; position: sticky; top: 0; overflow-y: auto; }
    #riel .riel-cab { padding: 22px 20px 12px; }
    #riel .riel-lista { flex: 1; }
    #riel .riel-pie { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); }
    .riel-fila { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border: none; background: none; width: 100%; text-align: left; border-radius: 0; }
    .riel-fila.activa { background: var(--amber-soft); border-radius: 14px; margin: 0 8px; width: calc(100% - 16px); padding-left: 12px; }
    .vista { max-width: 760px; padding-bottom: 40px; }
    #tabbar { left: 340px; }
    .vista.sin-tab { padding-bottom: 130px; }
    .barra-fija { left: 340px; }
    .barra-fija > * { max-width: 728px; }
    .firma-caja { height: 300px; }
    #v-hoy .solo-movil { display: none; }
  }
  @media (max-width: 899px) { .solo-tablet { display: none !important; } }
  @media (prefers-reduced-motion: reduce) { .vista, .hoja { animation: none; } .barra-tiempo i { transition: none; } }
</style>

// ─── SESIÓN (Supabase Auth por su API, sin librería) ─────────────────────────
// El profesor entra una vez y la sesión queda guardada en el teléfono: se
// renueva sola con el refresh token aunque cierre la app, pasen días o se
// quede sin cobertura. Solo vuelve a pedir el login si Supabase rechaza la
// renovación (contraseña cambiada, sesión revocada) o si pulsa «Cerrar sesión».
// Antes: supabase-js desde un CDN (si al abrir la app la red tardaba, la carga
// o la renovación fallaban y salía el login), cualquier 401 cerraba la sesión
// y olvidaba el profesor, y «Cerrar sesión» la cerraba en TODOS los teléfonos
// de la cuenta (signOut global): un profesor que salía echaba a los demás.
class SesionCaducada extends Error {}
function sesionCruda() { try { return JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); } catch { return null; } }
function uidDeToken(t) {
  try { return JSON.parse(atob(String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub || null; } catch { return null; }
}
function guardarSesion(r) {
  const previa = sesionCruda();
  const u = r.user || (previa && previa.user) || {};
  const s = {
    access_token: r.access_token, refresh_token: r.refresh_token,
    expires_at: Number(r.expires_at) || Math.floor(Date.now() / 1000) + (Number(r.expires_in) || 3600),
    user: { id: u.id || uidDeToken(r.access_token), email: u.email || null }
  };
  try { localStorage.setItem(SESION_KEY, JSON.stringify(s)); if (s.user.email) localStorage.setItem(ULTIMO_EMAIL_KEY, s.user.email); } catch {}
  return s;
}
function leerSesion() {
  let s = sesionCruda();
  if (!s) {
    // Sesión abierta con la versión anterior de la web (supabase-js): se adopta
    // para que nadie tenga que volver a entrar tras la actualización.
    try {
      const clave = 'sb-' + new URL(SUPABASE_URL).hostname.split('.')[0] + '-auth-token';
      const v = JSON.parse(localStorage.getItem(clave) || 'null');
      const vieja = v && (v.currentSession || v);
      if (vieja && vieja.refresh_token) { s = guardarSesion(vieja); localStorage.removeItem(clave); }
    } catch {}
  }
  return s && s.refresh_token ? s : null;
}
function borrarSesion() { try { localStorage.removeItem(SESION_KEY); } catch {} }
const cuentaActual = () => { const s = leerSesion(); return s && s.user ? s.user.id : null; };

async function authPost(ruta, cuerpo, token) {
  const headers = { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await Offline.fetchConTope(fetch, `${SUPABASE_URL}/auth/v1/${ruta}`, { method: 'POST', headers, body: JSON.stringify(cuerpo || {}) }, 12000);
  let datos = null; try { datos = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, datos };
}
// Una sola renovación a la vez (el refresh token solo vale una vez).
let _renovando = null;
function renovarSesion() {
  if (_renovando) return _renovando;
  _renovando = (async () => {
    const s = leerSesion(); if (!s) throw new SesionCaducada();
    let r;
    try { r = await authPost('token?grant_type=refresh_token', { refresh_token: s.refresh_token }); } catch { throw new Error('Sin conexión'); }
    if (r.ok && r.datos && r.datos.access_token) return guardarSesion(r.datos);
    // Otra pestaña la renovó justo antes: ya hay otro refresh token guardado.
    const ahora = leerSesion();
    if (ahora && ahora.refresh_token !== s.refresh_token) return ahora;
    if (r.status >= 500 || r.status === 429) throw new Error('Sin conexión'); // fallo pasajero: se reintenta luego
    throw new SesionCaducada();
  })().finally(() => { _renovando = null; });
  return _renovando;
}
async function tokenAcceso() {
  let s = leerSesion(); if (!s) throw new SesionCaducada();
  if (!s.access_token || s.expires_at * 1000 - Date.now() < 90000) {
    try { s = await renovarSesion(); } catch (e) { if (e instanceof SesionCaducada) throw e; /* sin red: se prueba con el que hay */ }
  }
  return s.access_token;
}

async function apiFetch(url, options = {}, reintento = false) {
  const esGet = !options.method || String(options.method).toUpperCase() === 'GET';
  let token;
  try { token = await tokenAcceso(); } catch (e) { if (e instanceof SesionCaducada) sesionCaducada(); throw new Error('Sesión expirada'); }
  if (!hayRed()) return sinRed(url, esGet);
  let res;
  try { res = await Offline.fetchConTope(fetch, url, { ...options, headers: { ...(options.headers || {}), Authorization: 'Bearer ' + token } }, esGet ? 12000 : 25000); }
  catch (e) { redCaida(); return sinRed(url, esGet); }
  // Servidor o pasarela caídos (502/503/504): se trata igual que no tener cobertura
  if (res.status === 502 || res.status === 503 || res.status === 504) { redCaida(); return sinRed(url, esGet); }
  redOk();
  if (res.status === 401) {
    if (!reintento) {
      try { await renovarSesion(); } catch (e) { if (e instanceof SesionCaducada) { sesionCaducada(); throw new Error('Sesión expirada'); } throw new Error('Sin conexión'); }
      return apiFetch(url, options, true);
    }
    sesionCaducada(); throw new Error('Sesión expirada');
  }
  // La última respuesta de cada lectura se guarda para poder trabajar sin cobertura
  if (esGet && res.ok && Offline.claveCache(url)) res.clone().text().then(t => OFF.cache.guardar(url, t)).catch(() => {});
  return res;
}
// Sin red: las lecturas salen de la última copia guardada; lo demás falla como «Sin conexión»
async function sinRed(url, esGet) {
  if (esGet) {
    const c = await OFF.cache.leer(url).catch(() => null);
    if (c) { S.datosDeCache = c.ts; return new Response(c.texto, { status: 200, headers: { 'Content-Type': 'application/json', 'x-desde-cache': '1' } }); }
    if (/^\/api\/hoy\b/.test(url)) return new Response(JSON.stringify({ ok: true, practicas: [], sin_cerrar: [], reservas: [] }), { status: 200, headers: { 'Content-Type': 'application/json', 'x-desde-cache': '1' } });
  }
  throw new Offline.ErrorRed();
}

async function iniciarSesion() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (!email || !password) { err.textContent = 'Introduce tu email y contraseña.'; return; }
  err.textContent = '';

  try {
    let r;
    try { r = await authPost('token?grant_type=password', { email, password }); } catch { err.textContent = 'Sin conexión. Revisa la cobertura e inténtalo otra vez.'; return; }
    if (!r.ok || !r.datos || !r.datos.access_token) {
      const d = r.datos || {}, m = String(d.error_description || d.msg || d.message || d.error || '');
      err.textContent = /not.confirmed/i.test(m + d.error_code) ? 'Falta confirmar este email (revisa tu correo).'

    }

    try {
      localStorage.setItem(ULTIMO_EMAIL_KEY, email);

      if (localStorage.getItem(ULTIMA_CUENTA_KEY) !== s.user.id) { borrarFlujos(); localStorage.removeItem(VEHICULO_KEY); localStorage.setItem(ULTIMA_CUENTA_KEY, s.user.id); OFF.cache.vaciar().catch(() => {}); }
    } catch {}
    document.getElementById('login-password').value = '';
    const perfil = perfilGuardado(s.user.id);
    if (perfil) { S.perfil = perfil; entrarApp(); revisarPerfil(); } else await mostrarPerfiles();
  } finally { if (btn) btn.disabled = false; }
}

document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') iniciarSesion(); });

// ─── AVISOS DE LA PRÁCTICA (notificaciones) ──────────────────────────────────
// Ajustes de cada teléfono en Perfil → Avisos de la práctica. Los avisos con
// hora («quedan 5 min», «hora de terminar», «sigue abierta») los manda el
// servidor (Web Push, /api/avisos → pg_cron → /api/avisos-enviar): llegan con
// la pantalla apagada y la app cerrada. La notificación «Práctica en curso» la
// pone el propio teléfono y se queda en la pantalla de bloqueo y en el centro
// de notificaciones mientras dura la clase. iPhone: con la app instalada
// (iOS 16.4+). La isla dinámica (Live Activities) exige una app nativa.
const AVISOS_KEY = 'km_avisos';                 // ajustes de avisos de este teléfono
const AVISOS_ACTIVOS_KEY = 'km_avisos_activos'; // '1' = suscrito en el servidor
const AVISOS_VISTO_KEY = 'km_avisos_visto';     // tarjeta «Activa los avisos» descartada
const AVISOS_DEF = { antes: 5, alFinal: true, despues: 10, enVivo: true };
const ETIQUETA_EN_VIVO = 'practica-en-curso';
function avisosAjustes() { try { return { ...AVISOS_DEF, ...JSON.parse(localStorage.getItem(AVISOS_KEY) || '{}') }; } catch { return { ...AVISOS_DEF }; } }
function guardarAvisosAjustes(cambio) { const a = { ...avisosAjustes(), ...cambio }; try { localStorage.setItem(AVISOS_KEY, JSON.stringify(a)); } catch {} return a; }
const pushSoportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const permisoAvisos = () => ('Notification' in window ? Notification.permission : 'unsupported');
const avisosActivos = () => permisoAvisos() === 'granted' && localStorage.getItem(AVISOS_ACTIVOS_KEY) === '1';
const iphoneSinInstalar = () => esIOS() && !enModoApp();
async function registroSW() {

}
function claveVapid(b64) {
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
// Suscripción de este teléfono al servicio de push (la crea si se pide).
async function suscripcionAvisos(crear = false) {
  if (!pushSoportado() || permisoAvisos() !== 'granted') return null;
  const reg = await registroSW(); if (!reg || !reg.pushManager) return null;
  let sub = await reg.pushManager.getSubscription();
  if (!sub && crear) {
    if (!S.vapid) throw new Error('Los avisos aún no están disponibles en el servidor.');
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveVapid(S.vapid) });
  }
  return sub;
}
async function guardarSuscripcion(sub) {
  const res = await postJSON('/api/avisos', { accion: 'suscribir', suscripcion: sub.toJSON(), profesor_id: (S.perfil && S.perfil.id) || null });
  const data = await res.json().catch(() => ({}));

}
async function activarAvisos() {

  } catch {}

// Notificación «Práctica en curso» (o «en pausa»): una sola, que se va
// actualizando; al cerrar o cancelar la práctica se retira.
async function mostrarEnVivo(F) {

  const reg = await registroSW(); if (!reg || !reg.showNotification) return;

}
// Se llama al empezar, pausar, reanudar, cambiar los ajustes, volver a la
// práctica ('reprogramar'), al cerrarla o cancelarla ('fin' / 'cancelar') y al
// cambiar de perfil con ella abierta ('aparcar': se quitan sus avisos de este

async function avisosPractica(evento) {
  const F = S.flujo; if (!F || !F.practica_id) return;

    const quitar = evento === 'aparcar' || !esDelPerfil(F);
    if (cerrar || quitar || !aj.enVivo) await cerrarEnVivo(); else await mostrarEnVivo(F);
    if (cerrar || !avisosActivos()) return; // al cerrar/cancelar los quita el servidor
    const sub = await suscripcionAvisos(); if (!sub) return;
    const lista = [];
    if (!F.pausada_ms && !quitar) {
      const fin = finPrevistoMs(F), hasta = hhmm(new Date(fin)), quien = F.alumno_nombre || 'Alumno';
      if (aj.antes) lista.push({ tipo: 'antes', enviar_en: new Date(fin - aj.antes * 60000).toISOString(), titulo: `Quedan ${aj.antes} min de práctica`, cuerpo: `${quien} · termina a las ${hasta}`, etiqueta: ETIQUETA_EN_VIVO });

    }
    await postJSON('/api/avisos', { accion: 'programar', endpoint: sub.endpoint, practica_id: F.practica_id, profesor_id: S.perfil && S.perfil.id ? S.perfil.id : null, avisos: lista.filter(a => Date.parse(a.enviar_en) > Date.now() + 5000) });

async function cargarBase() {

    if (rc && rc.ok) { const c = await rc.json(); S.zonas = Array.isArray(c.zonas) ? c.zonas : []; S.duracionClase = parseInt(c.duracion_clase_min) || 45; if (c.km_auto && c.km_auto.min > 0) S.kmAuto = c.km_auto; S.vapid = c.vapid_public || null; S.centro = c.centro || null; }

// ─── COCHE DEL PROFESOR ──────────────────────────────────────────────────────
// Cada profesor suele dar sus clases en su coche (Perfil → Coche de cada

function cocheHabitual(pid = S.perfil && S.perfil.id) {
  const p = pid ? S.profesores.find(x => x.id === pid) : null;

}
function cocheElegidoHoy() {

    if (c && c.fecha === fechaLocal() && c.perfil === (S.perfil ? S.perfil.id : null) && vehiculo(c.id)) return c.id;
  } catch {}

  else if (esHoy) html += `<button class="lnk lnk-suave lnk-olvido" onclick="abrirAnotar({volverA:'hoy'})">${ic('hist', 18)} ¿Se te olvidó anotar una clase? Anotar clase pasada</button>`;

// Clases seguidas de una misma sesión (mismo alumno y coche, km encadenados y
// mismo estado de firma: p. ej. 90 min guardados como 2 clases) se muestran y
// se firman juntas. Devuelve una fila por sesión con `ids` y `n`.
function agruparSesiones(lista) {
  const orden = lista.slice().sort((a, b) => (a.hora_inicio || '').localeCompare(b.hora_inicio || '') || a.km_inicial - b.km_inicial || a.id - b.id);
  const grupos = [];
  for (const p of orden) {
    const g = grupos[grupos.length - 1], u = g && g[g.length - 1];
    if (u && u.alumno_id === p.alumno_id && u.vehiculo_id === p.vehiculo_id && u.km_final > 0 && u.km_final === p.km_inicial && !!u.firmada === !!p.firmada) g.push(p);
    else grupos.push([p]);
  }
  return grupos.map(g => ({ ...g[0], ids: g.map(x => x.id), n: g.reduce((t, x) => t + (x.nLocal || x.fraccion || 1), 0), km_final: g[g.length - 1].km_final, hora_fin: g[g.length - 1].hora_fin, km: g.reduce((t, x) => t + (x.km || 0), 0) }));
}
// Las flechas del día responden al instante: la fecha cambia y se pinta lo último que se sabía de ese
// día (o filas grises); los datos nuevos llegan detrás. Con varios toques seguidos solo se pide el
// último día y una respuesta antigua nunca pisa a una más reciente.
function cambiarDia(n) {
  actualizarHoy();
  S.fecha = n === 0 ? S.hoy : sumaDias(S.fecha, n);
  const guardado = S.fecha === S.hoy && S.jornadaHoy && !S.jornadaHoy.cargando ? S.jornadaHoy : diaEnCache(S.fecha);
  S.jornada = guardado || jornadaVacia(true);
  if (S.vista === 'hoy') renderHoy();
  clearTimeout(S.tDia);
  S.tDia = setTimeout(cargarDia, guardado ? 0 : 140);
}
async function cargarDia() {
  const fecha = S.fecha, mio = ++S.cargaDia;
  try {
    const j = await pedirJornada(fecha);
    guardarDiaEnCache(fecha, j);
    if (mio !== S.cargaDia || fecha !== S.fecha) return;   // se tocó otra flecha mientras llegaba
    S.jornada = j; if (fecha === S.hoy) S.jornadaHoy = j;
    sobreponerJornada();
    if (S.vista === 'hoy') renderHoy();
    renderRiel();
    precargarDias(fecha);
    // La jornada de hoy (la del riel) se renueva detrás si lleva un rato sin actualizarse
    if (fecha !== S.hoy) { const c = S.cacheDia.get(claveDia(S.hoy)); if (!c || Date.now() - c.t > 60000) pedirJornada(S.hoy).then(h => { guardarDiaEnCache(S.hoy, h); S.jornadaHoy = h; sobreponerJornada(); renderRiel(); }).catch(() => {}); }
  } catch (e) {
    if (mio !== S.cargaDia) return;
    if (S.jornada.cargando) { S.jornada.cargando = false; if (S.vista === 'hoy') renderHoy(); }
    if (e.message !== 'Sesión expirada') toast(e.message || 'No se pudo cargar la jornada');
  }
}
// Los días de al lado se piden con calma, para que la flecha siguiente también sea instantánea
function precargarDias(fecha) {
  clearTimeout(S.tPre);
  S.tPre = setTimeout(() => {
    if (!hayRed() || document.hidden || S.fecha !== fecha) return;
    for (const f of [sumaDias(fecha, -1), sumaDias(fecha, 1)]) {
      const c = S.cacheDia.get(claveDia(f));
      if (c && Date.now() - c.t < 60000) continue;
      pedirJornada(f).then(j => guardarDiaEnCache(f, j)).catch(() => {});
    }
  }, 600);
}

// Clase anterior y siguiente del coche ese día a esa hora (GET /api/km-coche)
async function cargarKmAnotar() {

const cuandoClase = c => `${c.alumno ? esc(c.alumno.split(' ')[0]) + ', ' : ''}${esc(fechaCorta(c.fecha))}${c.hora ? ' a las ' + esc(c.hora) : ''}`;

    if (!ant) return { ok: false, cls: 'msg-err', txt: 'Este coche no tiene ninguna clase anterior con km: escríbelos o déjalos en blanco.' };

const textoBotonAnotar = n => n > 1 ? `Anotar ${clasesTxt(n)}` : (n < 1 && n >= 0.25 ? `Anotar ${clasesTxt(n)}` : 'Anotar clase');

// Mensaje de km y botón de Anotar sin volver a pintar la pantalla (no se pierde el teclado)

function toggleListaAnotar(campo, valor) {

async function enviarAnotar(forzar = false) {
  const A = S.anotar; if (!A || A.enviando) return;
  const btn = document.getElementById('btn-anotar');
  A.enviando = true; btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const res = await postJSON('/api/anotar-practica', {
      alumno_id: A.alumno_id, vehiculo_id: A.vehiculo_id, fecha: A.fecha, hoy: S.hoy,
      hora_inicio: A.hora || null, hora_fin: A.hora && minutosDe(A) ? sumaMin(A.hora, minutosDe(A)) : null,
      ...(A.modo === 'minutos' ? { minutos: parseInt(A.minutos) } : { n_clases: A.n_clases || 1 }),
      ...(A.kmModo === 'auto' ? { km_auto: true } : A.kmModo === 'escribo' ? { km_inicial: A.km_ini || null, km_final: A.km_fin || null } : { km_inicial: null, km_final: null }),
      zonas: A.zonas, trabajado: A.trabajado, observacion: A.obs,
      profesor_id: S.perfil ? S.perfil.id : null, forzar
    });
    const data = await res.json();
    if (res.status === 409 && data.duplicada && !forzar) {
      A.enviando = false;
      if (confirm(`${data.error}\n\n¿Es otra clase distinta? Pulsa Aceptar para anotarla igualmente.`)) return enviarAnotar(true);
      renderAnotar(); return;
    }
    // La app no ha podido calcular los km (no caben o el coche no tiene clases con km): a escribirlos
    if (res.status === 409 && (data.codigo === 'km_no_caben' || data.codigo === 'sin_km_anterior')) {
      A.enviando = false; A.kmModo = 'escribo'; renderAnotar(); toast(data.error, 5200); return;
    }
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo anotar la clase');
    const al = alumno(A.alumno_id);
    S.anotar = null;
    if (S.cal) S.cal.cache = {};
    await cargarBase();
    if (data.minutos_sobrantes > 0) toast(`Le quedan ${minTxt(data.minutos_sobrantes)} acumulados para la próxima.`, 4200);
    if (data.con_km) {
      abrirHoja(`<div class="hoja-tit"><h3>${data.clases > 1 ? fmtC(data.clases) + ' clases anotadas' : 'Clase anotada'}</h3><button class="cab-atras" onclick="cerrarHoja();volverDeAnotar('${A.volverA}','${A.fecha}',${A.alumno_id})" aria-label="Cerrar">${ic('cerrar', 22)}</button></div>
        <div class="msg msg-ok" style="margin-top:0">${ic('ok', 20)}<span>${esc(data.mensaje || 'Guardada')}.</span></div>
        <p class="fila-sub" style="font-size:16px;margin:14px 2px">¿Está ${esc(al ? nombreAlumno(al).split(' ')[0] : 'el alumno')} contigo? Puede firmarla ahora.</p>
        <button class="btn btn-pri btn-lg" onclick="firmarAnotada(${data.practica_ids[0]},'${A.volverA}')">${ic('lapiz', 18)} Que firme ahora</button>
        <button class="btn btn-sec" onclick="cerrarHoja();volverDeAnotar('${A.volverA}','${A.fecha}',${A.alumno_id})">Más tarde</button>`);
    } else {
      toast(`${data.mensaje || 'Clase anotada'}. Los km se rellenan desde la oficina.`, 3600);
      volverDeAnotar(A.volverA, A.fecha, A.alumno_id);
    }
  } catch (e) {
    if (S.anotar) S.anotar.enviando = false;
    if (esRed(e) && S.anotar) { await anotarSinConexion(S.anotar); return; }
    if (e.message !== 'Sesión expirada') { toast(e.message, 4200); if (S.vista === 'anotar') renderAnotar(); }
  }
}
// La clase olvidada se guarda en la tablet y se envía sola (sin firma: el alumno no suele estar delante)
async function anotarSinConexion(A) {
  const al = alumno(A.alumno_id), v = vehiculo(A.vehiculo_id);
  const hora_fin = A.hora && minutosDe(A) ? sumaMin(A.hora, minutosDe(A)) : null;
  const n = cantidadDe(A);
  let kmI = A.kmModo === 'escribo' ? parseInt(A.km_ini) || 0 : 0, kmF = A.kmModo === 'escribo' ? parseInt(A.km_fin) || 0 : 0, calculados = false;
  const ant = A.ctx && A.ctx.anterior, sig = A.ctx && A.ctx.siguiente;
  if (A.kmModo === 'auto' && ant) {
    kmI = ant.km; kmF = kmI + kmAutoLocal(n);
    if (sig && kmF > sig.km) kmF = sig.km;
    if (kmF - kmI < Math.ceil(n - 1e-9)) { kmI = 0; kmF = 0; } else calculados = true;
  }
  const conKm = !!(kmI && kmF);
  await encolar({ tipo: 'registrar', url: '/api/registrar-clase', cuerpo: {
    cid: Offline.nuevoId(), alumno_id: A.alumno_id, vehiculo_id: A.vehiculo_id, fecha: A.fecha, hoy: S.hoy, hora_inicio: A.hora || null, hora_fin,
    ...(A.modo === 'minutos' ? { minutos: parseInt(A.minutos) } : { n_clases: A.n_clases || 1 }), km_inicial: conKm ? kmI : null, km_final: conKm ? kmF : null,
    ...(calculados ? { km_calculado: true } : {}),
    zonas: A.zonas, trabajado: A.trabajado, observacion: A.obs, profesor_id: S.perfil ? S.perfil.id : null, anotada: true },
    etiqueta: { alumno_id: A.alumno_id, vehiculo_id: A.vehiculo_id, alumno: al ? nombreAlumno(al) : '', matricula: v ? v.matricula : null, fecha: A.fecha, hora_inicio: A.hora || null, hora_fin,
      km_inicial: conKm ? kmI : 0, km_final: conKm ? kmF : 0, clases: n, firmada: false } });
  const { volverA, fecha, alumno_id } = A;
  S.anotar = null;
  toast('Sin conexión: la clase queda guardada en la tablet y se envía sola.', 4200);
  await cargarBase();
  volverDeAnotar(volverA, fecha, alumno_id);
  vaciarCola();
}
// Vuelve a donde se abrió, enseñando el día de la clase anotada.
async function volverDeAnotar(volverA, fecha, alumnoId) {
  if (volverA === 'ficha' && alumnoId) { abrirFicha(alumnoId); return; }
  if (volverA === 'historial') {
    if (!S.cal) S.cal = { mes: mesDe(fecha), dia: fecha, filtro: (S.perfil && S.perfil.id) ? 'mias' : 'todas', cache: {} };
    S.cal.mes = mesDe(fecha); S.cal.dia = fecha; S.cal.autoDia = false; S.cal.cache = {};
    go('historial'); return;
  }
  S.fecha = fecha;
  await cargarJornada(); go('hoy');
}
// Firma en el momento: el mismo flujo que «Firmar ahora» del detalle de la clase
// (agrupa las clases de la sesión si se anotaron varias).
async function firmarAnotada(id, volverA) {
  try {
    const res = await apiFetch('/api/practica-detalle?id=' + id);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo abrir la clase');
    S.detalle = data.practica;
    firmarDesdeDetalle();
    if (S.flujo) { S.flujo.volverA = volverA || 'hoy'; guardarFlujo(); }
    if (!volverA || volverA === 'hoy') S.fecha = data.practica.fecha; // al terminar, Hoy enseña el día de la clase
    if (volverA === 'historial' && S.cal) { S.cal.mes = mesDe(data.practica.fecha); S.cal.dia = data.practica.fecha; S.cal.autoDia = false; }
  } catch (e) { if (e.message !== 'Sesión expirada') { cerrarHoja(); toast(e.message); } }
}

// ─── EN CURSO ────────────────────────────────────────────────────────────────
async function continuarPractica(id) {
  let p = S.jornada.practicas.find(x => x.id === id) || S.jornada.sin_cerrar.find(x => x.id === id) ||
    S.jornadaHoy.practicas.find(x => x.id === id) || S.jornadaHoy.sin_cerrar.find(x => x.id === id);
  if (!p) return;
  if (p.local) {   // clase que vive solo en esta tablet: en marcha, o por enviar
    if (S.flujo && S.flujo.local) go(S.flujo.cerrada ? 'firma' : 'curso'); else hojaPendientes();
    return;
  }
  if (S.flujo && S.flujo.local) { toast('Termina primero la práctica en curso.'); go(S.flujo.cerrada ? 'firma' : 'curso'); return; }
  if (!S.flujo || S.flujo.practica_id !== id) {
    if (flujoActivo()) { toast('Termina primero la práctica en curso.'); go('curso'); return; }
    // Una clase en marcha en otro teléfono (cronómetro, km y firma están allí): tomarla aquí es posible, pero
    // el otro teléfono no se entera. Se avisa siempre, y la clase solo debe cerrarse en uno de los dos.
    const enMarcha = !p.km_final && !p.sin_cerrar && !p.local;
    if (enMarcha) {
      const de = deOtroProfesor(p) ? ` de ${nombreProfesor(p.profesor_id) || 'otro profesor'}` : '';
      if (!confirm(`Esta clase${de} está en marcha en OTRO teléfono (el cronómetro, el km y la firma están allí).\n\nSi la sigues en este, el otro no lo sabrá: ciérrala solo en uno de los dos. No recibirás sus avisos.\n\n¿Seguirla en este teléfono?`)) return;
    } else if (!p.km_final && deOtroProfesor(p) && !confirm(`Esta clase es de ${nombreProfesor(p.profesor_id) || 'otro profesor'} y se está dando desde otro teléfono. ¿Seguirla en este? (No recibirás sus avisos.)`)) return;
    S.flujo = flujoDesdePractica(p); if (enMarcha) S.flujo.deOtroTelefono = true; guardarFlujo();
  }
  if (p.km_final) {
    const J = S.jornada.practicas.some(x => x.id === id) ? S.jornada : S.jornadaHoy;
    const ses = agruparSesiones(J.practicas.filter(x => x.km_final > 0)).find(g => g.ids.includes(id));
    const F = S.flujo;
    F.cerrada = true; F.km_final = p.km_final;
    if (ses && ses.ids.length > 1) Object.assign(F, { practica_id: ses.ids[0], practica_ids: ses.ids, n_clases: ses.n, clase_n: ses.clase_n, km_inicial: ses.km_inicial, km_final: ses.km_final, hora_inicio: ses.hora_inicio, hora_fin: ses.hora_fin });
    else Object.assign(F, { practica_ids: [p.id], n_clases: p.fraccion || 1 });
    guardarFlujo(); go('firma'); return;
  }
  go('curso');
  avisosPractica('reprogramar');
}
function pararTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

// ─── DOS TELÉFONOS CON LA MISMA CLASE ────────────────────────────────────────
// Si otro teléfono cancela o cierra la clase que este tiene en marcha, hay que enterarse ANTES de seguir:
// el cronómetro seguiría corriendo sobre algo que ya no existe y los km acabarían mal. Se comprueba al
// volver a la app, cada minuto con la clase abierta y al pulsar «Finalizar». Si la cancelaron, se ofrece
// guardarla igualmente con los km de este teléfono (pasa a ser una clase «local», como las de sin cobertura).
async function comprobarFlujoRemoto() {
  const F = S.flujo;
  if (!flujoActivo() || F.local || !F.practica_id || F.cancelada || !hayRed() || S.comprobandoFlujo) return;
  S.comprobandoFlujo = true;
  try {
    const res = await apiFetch('/api/estado-practica?id=' + F.practica_id);
    if (!res.ok || res.headers.get('x-desde-cache')) return;
    const d = await res.json();
    if (S.flujo !== F || !flujoActivo() || F.local) return;   // mientras tanto cambió la situación aquí
    if (d.estado === 'cancelada' || d.estado === 'no_existe') { F.cancelada = true; guardarFlujo(); if (S.vista === 'curso') renderCurso(); hojaClaseCancelada(); }
    else if (d.estado === 'cerrada') hojaClaseCerradaFuera(d);
  } catch { /* sin red no se puede saber: se sigue como hasta ahora */ }
  finally { S.comprobandoFlujo = false; }
}
function hojaClaseCancelada() {
  const F = S.flujo; if (!F) return;
  abrirHoja(`<div class="hoja-tit"><h3>Clase cancelada desde otro teléfono</h3></div>
    <div class="card card-pad"><div class="msg msg-err" style="margin-top:0">${ic('aviso', 20)}<span>La clase de <b>${esc(F.alumno_nombre || 'el alumno')}</b> (empezada a las ${esc(F.hora_inicio || '--:--')} en el km ${miles(F.km_inicial)}) ya no existe en la nube: otro teléfono la canceló. Este teléfono seguía con el cronómetro.</span></div>
      <p class="fila-sub" style="margin:12px 2px 0;font-size:15.5px">Si la clase se dio, guárdala igualmente: cuando acabes, se registra de nuevo con tus km y tu firma.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        <button class="btn btn-pri btn-lg" onclick="recuperarClaseCancelada()">${ic('ok', 20, 'style="stroke-width:2.6"')} Guardarla igualmente</button>
        <button class="btn btn-sec" onclick="descartarClaseCancelada()">No se dio: descartarla</button></div></div>`);
}
function recuperarClaseCancelada() {
  const F = S.flujo; cerrarHoja(); if (!F) return;
  cerrarEnVivo().catch(() => {});
  // Pasa a ser una clase de este teléfono (sin practica_id): al cerrarla nace UNA operación «registrar» con todos sus datos
  Object.assign(F, { local: true, cid: Offline.nuevoId(), practica_id: null, practica_ids: [], cancelada: false, recuperada: true, deOtroTelefono: false });
  guardarFlujo();
  toast('Sigue la clase: al terminarla se guardará de nuevo con sus km.', 4200);
  if (S.vista === 'curso') renderCurso(); else if (S.vista === 'kmfinal') renderKmFinal(); else go('curso');
}
async function descartarClaseCancelada() {
  cerrarHoja();
  await avisosPractica('cancelar');
  S.flujo = null; guardarFlujo(); pararTimer();
  toast('Clase descartada');
  await cargarJornada(); go('hoy');
}
function hojaClaseCerradaFuera(d) {
  const F = S.flujo; if (!F) return;
  abrirHoja(`<div class="hoja-tit"><h3>Clase cerrada desde otro teléfono</h3></div>
    <div class="card card-pad"><div class="msg msg-warn" style="margin-top:0">${ic('aviso', 20)}<span>La clase de <b>${esc(F.alumno_nombre || 'el alumno')}</b> ya la cerraron en otro teléfono (km ${miles(d.km_inicial)} → ${miles(d.km_final)})${d.firmada ? ' y está firmada' : ': falta la firma del alumno'}. Se conservan esos km; no hace falta cerrarla otra vez.</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        ${d.firmada ? `<button class="btn btn-pri btn-lg" onclick="cerrarClaseCerradaFuera(false)">Entendido</button>` : `<button class="btn btn-pri btn-lg" onclick="cerrarClaseCerradaFuera(true, ${parseInt(d.km_inicial) || 0}, ${parseInt(d.km_final) || 0})">Ir a la firma</button><button class="btn btn-sec" onclick="cerrarClaseCerradaFuera(false)">Firmará el otro teléfono</button>`}</div></div>`);
}
async function cerrarClaseCerradaFuera(firmar, kmIni, kmFin) {
  const F = S.flujo; cerrarHoja(); if (!F) return;
  const id = F.practica_id;
  await avisosPractica('cancelar');
  await cargarJornada();
  if (firmar) {
    const hay = [...S.jornada.practicas, ...S.jornadaHoy.practicas, ...S.jornada.sin_cerrar, ...S.jornadaHoy.sin_cerrar].some(p => p.id === id && p.km_final > 0);
    if (hay) { continuarPractica(id); return; }
    // No sale en la lista de este perfil: se firma con los datos que dio el servidor
    Object.assign(F, { cerrada: true, km_inicial: kmIni || F.km_inicial, km_final: kmFin, practica_ids: [id], hora_fin: F.hora_fin || hhmm(), deOtroTelefono: false });
    guardarFlujo(); go('firma'); return;
  }
  S.flujo = null; guardarFlujo(); pararTimer(); go('hoy');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) comprobarFlujoRemoto(); });
setInterval(() => { if (!document.hidden && ['curso', 'kmfinal'].includes(S.vista)) comprobarFlujoRemoto(); }, 60000);
// ─── PAUSA ───────────────────────────────────────────────────────────────────
// «Pausar» detiene el cronómetro por un imprevisto: el tiempo de clase es el
// efectivo (sin pausas) y la hora de fin prevista se corre lo que dure la

async function continuarFirma() {
  const F = S.flujo; let kf = parseInt(S.kmFinal) || 0;

  if (!auto && kf - F.km_inicial > 300 && !confirm(`Son ${kf - F.km_inicial} km en una sola práctica. ¿Es correcto?`)) return;
  const sig = siguienteKmFinal();
  if (!auto && sig && kf > sig.km && !confirm(`La clase siguiente de este coche empezó en el km ${miles(sig.km)} y has puesto ${miles(kf)}: los km se pisarían. ¿Guardar igualmente?`)) return;
  const btn = document.getElementById('btn-firma'); btn.disabled = true; btn.textContent = 'Guardando…';
  if (F.local || !hayRed()) { await cerrarSinConexion(F, kf, auto, porMinutos); return; }
  try {
    const res = await postJSON('/api/finalizar-practica', {
      practica_id: F.practica_id, ...(auto ? { km_auto: true } : { km_final: kf }), trabajado: F.trabajado, observacion: F.observacion, hora_fin: hhmm(),
      zonas: F.zonas || [], ...(porMinutos ? { minutos: parseInt(F.minutos) } : { n_clases: F.n_clases || 1 })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      // No caben los km automáticos (la siguiente práctica del coche empieza muy cerca): a escribirlos
      if (data.codigo === 'km_no_caben') { F.kmModo = 'manual'; guardarFlujo(); renderKmFinal(); toast(data.error, 5000); return; }
      // Otro teléfono canceló la clase: se ofrece guardarla igualmente con los km escritos aquí

    }

    F.practica_ids = Array.isArray(data.practica_ids) && data.practica_ids.length ? data.practica_ids : [F.practica_id];
    F.n_clases = data.clases || cantidadDe(F);
    guardarFlujo();
    avisosPractica('fin');
    // refresca datos locales del alumno y del vehículo
    const al = alumno(F.alumno_id); if (al && data.alumno) { al.clases = data.alumno.clases; al.km = data.alumno.km; }
    if (al && data.minutos_sobrantes !== undefined) {
      al.minutos_sobrantes = data.minutos_sobrantes;
      if (data.minutos_sobrantes > 0) toast(`${clasesTxt(F.n_clases)} guardadas. A ${nombreAlumno(al).split(' ')[0]} le quedan ${minTxt(data.minutos_sobrantes)} acumulados para la próxima.`, 4200);
    }
    const v = vehiculo(F.vehiculo_id); if (v) { v.km_actual = Math.max(v.km_actual || 0, kf); v.ultimo = { km_final: kf, hora: F.hora_inicio, alumno: F.alumno_nombre, fecha: F.fecha }; }
    go('firma');
  } catch (e) {
    if (esRed(e)) { await cerrarSinConexion(F, kf, auto, porMinutos); return; }
    if (e.message !== 'Sesión expirada') { toast(e.message); btn.disabled = false; btn.innerHTML = 'Continuar a la firma ' + ic('flecha', 20); }

const horaAMin = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return a * 60 + b; };
function iniciarLienzo() {
  lienzo = document.getElementById('firma-cv'); if (!lienzo) return;
  const caja = document.getElementById('firma-caja');
  const dpr = window.devicePixelRatio || 1;
  const w = caja.clientWidth, h = caja.clientHeight;
  lienzo.width = w * dpr; lienzo.height = h * dpr;
  ctx = lienzo.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14161B';
  S.firmaTrazos = 0; S.firmaCaja = null;
  const punto = e => {
    const r = lienzo.getBoundingClientRect(); const p = { x: e.clientX - r.left, y: e.clientY - r.top };
    const c = S.firmaCaja || (S.firmaCaja = { x0: p.x, y0: p.y, x1: p.x, y1: p.y });
    c.x0 = Math.min(c.x0, p.x); c.y0 = Math.min(c.y0, p.y); c.x1 = Math.max(c.x1, p.x); c.y1 = Math.max(c.y1, p.y);
    return p;

  lienzo.onpointermove = e => {
    if (!dibujando) return; e.preventDefault();
    const p = punto(e); const m = { x: (ultimoPunto.x + p.x) / 2, y: (ultimoPunto.y + p.y) / 2 };
    // Curva suave: de la mitad anterior a la nueva mitad, con el último punto como control.
    ctx.beginPath(); ctx.moveTo(ultimoMedio.x, ultimoMedio.y); ctx.quadraticCurveTo(ultimoPunto.x, ultimoPunto.y, m.x, m.y); ctx.stroke();
    ultimoMedio = m; ultimoPunto = p; S.firmaTrazos++;
    if (S.firmaTrazos > 8) document.getElementById('btn-conf').disabled = false;
  };
  const fin = () => { dibujando = false; };
  lienzo.onpointerup = fin; lienzo.onpointercancel = fin; lienzo.onpointerleave = fin;
}
function borrarFirma() {
  if (!ctx) return; ctx.clearRect(0, 0, lienzo.width, lienzo.height); S.firmaTrazos = 0; S.firmaCaja = null;
  document.getElementById('btn-conf').disabled = true; document.getElementById('firma-ayuda').hidden = false;
}
function firmaComoPNG(anchoMax = 480) {
  // Se recorta al contorno de lo dibujado (sin el blanco sobrante) y se reduce
  // a un PNG pequeño: suele quedar en 5-25 KB.
  const dpr = lienzo.width / (lienzo.clientWidth || lienzo.width) || 1;
  let x0 = 0, y0 = 0, w = lienzo.clientWidth, h = lienzo.clientHeight;
  const c = S.firmaCaja, m = 12;
  if (c) {
    x0 = Math.max(0, c.x0 - m); y0 = Math.max(0, c.y0 - m);
    w = Math.max(1, Math.min(lienzo.clientWidth, c.x1 + m) - x0); h = Math.max(1, Math.min(lienzo.clientHeight, c.y1 + m) - y0);
  }
  const escala = Math.min(1, anchoMax / w);
  const tmp = document.createElement('canvas');
  tmp.width = Math.max(1, Math.round(w * escala)); tmp.height = Math.max(1, Math.round(h * escala));
  tmp.getContext('2d').drawImage(lienzo, x0 * dpr, y0 * dpr, w * dpr, h * dpr, 0, 0, tmp.width, tmp.height);

}

// Con cientos de alumnos la lista se pinta por tandas (y la búsqueda espera un instante a que se

const ALUMNOS_TANDA = 60;
S.alumnosMax = ALUMNOS_TANDA;
function buscarAlumnos(v) {

function pintarListaAlumnos() {
