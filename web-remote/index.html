  /* ── TOKENS (mismo sistema visual que la app de escritorio) ── */
  :root {
    --ink: #14161B; --bg: #F3F2EE; --card: #FFFFFF; --line: #E3E1DB; --line-2: #D6D3CC; --soft: #EEECE7;
    --muted: #5E6068; --muted-2: #3A3D45; --faint: #6B6E76;
    --amber: #FFB81C; --amber-strong: #E09A00; --amber-ink: #8A5800; --amber-soft: #FFF3D1;
    --ok: #1D6B4F; --ok-soft: #E2F1E9; --err: #B42318; --err-soft: #FDECEA; --info: #1E4FB8; --info-soft: #E7EDFB;
    --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --tab-h: 68px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100dvh; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; font-size: 16px; line-height: 1.35; }
  body.oscuro { background: var(--ink); color: #F3F2EE; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); font-weight: 500; }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── PANTALLAS DE ACCESO ── */
  .acceso { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; gap: 22px; }
  .acceso-marca { display: flex; align-items: center; gap: 12px; }
  .acceso-marca .logo { width: 52px; height: 52px; border-radius: 14px; background: #fff; padding: 4px; box-shadow: 0 0 0 3px var(--amber); }
  .acceso-marca .logo img { width: 100%; height: 100%; object-fit: contain; }
  .acceso-marca h1 { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
  .acceso h2 { font-family: var(--font-display); font-size: 30px; font-weight: 700; }
  .acceso-sub { color: var(--muted); font-size: 16px; text-align: center; }
  .acceso-card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .campo { width: 100%; height: 52px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 12px; background: #fff; outline: none; }
  .campo:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20,22,27,.12); }
  textarea.campo { height: auto; min-height: 92px; padding: 12px 14px; resize: vertical; }
  .err-txt { color: var(--err); font-size: 14px; min-height: 18px; font-weight: 600; }
  .perfil-op { width: 100%; max-width: 360px; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 18px; font-weight: 600; text-align: left; }
  .perfil-op:active { background: var(--soft); }
  .perfil-op .chev { margin-left: auto; color: var(--faint); }

  /* ── BOTONES ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid transparent; font-size: 17px; font-weight: 700; width: 100%; }
  .btn-pri { background: var(--amber); color: var(--ink); }
  .btn-pri:active { background: var(--amber-strong); }
  .btn-pri[disabled] { background: var(--soft); color: #8C8F97; cursor: default; }
  .btn-sec { background: #fff; border-color: var(--line-2); color: var(--ink); }
  .btn-osc { background: var(--ink); color: #fff; }
  .btn-peq { height: 40px; width: auto; padding: 0 14px; font-size: 15px; border-radius: 10px; }
  .btn-lg { height: 60px; font-size: 19px; border-radius: 16px; }
  .lnk { background: none; border: none; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; font-size: 15px; padding: 6px 2px; }
  .lnk-suave { color: var(--muted); font-weight: 500; }

  /* ── VISTAS ── */
  #app { min-height: 100dvh; }
  .vista { display: none; padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; animation: entra .22s ease; }
  .vista.on { display: block; }
  .vista.sin-tab { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .cab-tit { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cab-tit h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1; }
  .cab-atras { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; flex-shrink: 0; }
  .fecha-lin { font-size: 15px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .fecha-lin button { background: none; border: none; color: var(--muted); padding: 2px 4px; display: inline-flex; }
  .grande { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; }
  .avatar { width: 44px; height: 44px; border-radius: 999px; background: var(--ink); color: var(--amber); border: none; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 19px; font-weight: 700; flex-shrink: 0; }
  .ini { width: 44px; height: 44px; border-radius: 999px; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .ini-lg { width: 62px; height: 62px; background: var(--amber); font-size: 26px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .card-pad { padding: 14px 16px; }
  .fila { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--soft); background: none; border-left: none; border-right: none; border-bottom: none; width: 100%; text-align: left; }
  .fila:first-child { border-top: none; }
  .fila-sub { font-size: 14px; color: var(--muted); }
  .fila-sub.mono { font-size: 13.5px; }
  .fila-tit { font-size: 16.5px; font-weight: 600; }
  .fila-hora { font-family: var(--font-mono); font-size: 15px; color: var(--muted); width: 50px; flex-shrink: 0; }
  .grupo-tit { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .grupo-tit a, .grupo-tit button { background: none; border: none; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }

  /* placa */
  .placa { display: inline-flex; align-items: stretch; height: 24px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; background: #fff; color: var(--ink); flex-shrink: 0; vertical-align: middle; }
  .placa-e { width: 11px; padding-bottom: 2px; background: #1D3F9E; color: #fff; font-size: 7px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; }
  .placa-n { padding: 0 7px; display: flex; align-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }

  /* pastillas */
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--muted-2); white-space: nowrap; }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-warn { background: var(--amber-soft); color: var(--amber-ink); }
  .pill-err { background: var(--err-soft); color: var(--err); }
  .pill-info { background: var(--info-soft); color: var(--info); }
  .pill-dark { background: var(--ink); color: #fff; }
  .pill-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--amber); }

  /* barra de progreso segmentada */
  .segs { display: flex; gap: 5px; margin: 8px 0 4px; }
  .segs i { flex: 1; height: 7px; border-radius: 999px; background: var(--line-2); }
  .segs i.hecha { background: var(--ink); }
  .segs i.curso { background: var(--amber); }
  .prog-lin { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; font-weight: 600; }
  .prog-lin b { font-family: var(--font-mono); font-weight: 600; }

  /* tarjeta AHORA */
  .ahora { background: var(--ink); color: #F3F2EE; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .ahora-cab { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 15px; color: #C9CBD1; }
  .ahora-et { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--amber); }
  .ahora-quien { display: flex; align-items: center; gap: 12px; }
  .ahora-quien .ini { background: #2A2D35; color: #F3F2EE; width: 50px; height: 50px; }
  .ahora-nom { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; }
  .ahora-sub { font-size: 15px; color: #A3A6AE; }

  /* vehículo actual */
  .veh-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .veh-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── INICIAR PRÁCTICA ── */
  .odo-wrap { position: relative; }
  .odo { display: flex; align-items: center; gap: 12px; }
  .odo-cajas { display: flex; gap: 6px; padding: 8px; background: #1E2027; border-radius: 14px; }
  .odo-cajas span { width: 40px; height: 58px; border-radius: 8px; background: #2B2E36; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 34px; font-weight: 600; }
  .odo-cajas span.cero { color: #5A5E68; }
  .odo-km { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
  .odo-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 15px; margin-top: 12px; }
  .msg-ok { background: var(--ok-soft); color: var(--ok); }
  .msg-warn { background: var(--amber-soft); color: var(--amber-ink); }
  .msg-err { background: var(--err-soft); color: var(--err); }
  .msg-gris { background: var(--soft); color: var(--muted-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { height: 48px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line-2); background: #fff; font-size: 16.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips-osc .chip { background: transparent; border-color: #4A4E58; color: #F3F2EE; }
  .chips-osc .chip.on { background: var(--amber); color: var(--ink); border-color: var(--amber); }
  .seg3 { display: flex; padding: 4px; background: var(--soft); border-radius: 14px; gap: 2px; }
  .seg3 button { flex: 1; height: 44px; border: none; border-radius: 10px; background: transparent; font-size: 16.5px; font-weight: 600; color: var(--muted-2); }
  .seg3 button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(20,22,27,.16); }
  .seg3.dos-lineas button { height: 56px; line-height: 1.15; }
  .instalar-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px 14px; }
  .instalar-card img { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
  .instalar-card .btn { flex-shrink: 0; }
  .instalar-pasos { margin: 6px 0 0; padding-left: 22px; font-size: 16px; line-height: 1.7; }
  .instalar-pasos b { white-space: nowrap; }
  .seg3 button small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .nclases { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 8px 8px 8px 16px; }
  .cant { margin-top: 10px; padding: 10px; }
  .cant .nclases { margin-top: 8px; padding: 2px 0 2px 6px; }
  .cant-frac { margin-top: 10px; }
  .cant-frac button { font-size: 19px; }

const PROFESOR_KEY = 'kmalumnos_profesor';   // perfil de profesor activo

const VEHICULO_KEY = 'km_vehiculo';          // último vehículo usado

const DIAS_ANOTAR = 30;                      // una clase olvidada se puede anotar hasta 30 días después (límite de la API)

// Zonas recorridas: las configura el escritorio (Ajustes → Zonas de prácticas)
// y llegan en S.zonas desde /api/config. Sin zonas no se muestra el bloque.
const TRABAJADO = ['Incorporaciones', 'Glorietas', 'Cambios de carril', 'Adelantamientos', 'Estacionamiento', 'Pasos de peatones', 'Prioridades', 'Marcha atrás'];

// ─── ESTADO ──────────────────────────────────────────────────────────────────
const S = {
  perfil: null, hoy: fechaLocal(), fecha: fechaLocal(),
  vehiculos: [], alumnos: [], profesores: [],
  jornada: { practicas: [], sin_cerrar: [], reservas: [] },
  jornadaHoy: { practicas: [], sin_cerrar: [], reservas: [] }, // la del riel: siempre la de HOY
  zonas: [], duracionClase: 45, cal: null, ultimaCarga: 0,

function fechaLocal(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const hhmm = (d = new Date()) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const sumaMin = (h, m) => { if (!h) return ''; const [a, b] = h.split(':').map(Number); const t = a * 60 + b + Math.round(m); return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const miles = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
// Minutos por clase (Ajustes del escritorio → /api/config). Una sesión de N
// clases dura N × durClase() y se guarda como N prácticas (90 min = 2 clases).

const nDeReserva = rv => rv && rv.duracion_min ? Math.min(MAX_CLASES, Math.max(0.25, aCuartos(rv.duracion_min / durClase()))) : 0;
const durTxt = m => { m = Math.round(m); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`; };
// 2.5 → «2 ½»; 0.75 → «¾»
const fmtC = n => { const v = aCuartos(n) || 0, e = Math.floor(v), f = ['', '¼', '½', '¾'][Math.round((v - e) * 4)]; return e && f ? `${e} ${f}` : f || String(e); };
const clasesTxt = n => `${fmtC(n)} ${n > 1 ? 'clases' : 'clase'}`;
// «Clase 8», «Clases 8–9», «Clase 8 · ½ clase». Con fracciones, cada clase
// lleva el nº de la clase en la que acaba (como en el detalle): tras 1 ½,
// otra ½ es la 2.ª. Con clases_antes (las que tenía al empezar) se calcula exacto.
const claseTxt = F => {
  const n = F.n_clases || 1;

  if (F.clases_antes != null) { desde = Math.ceil(F.clases_antes + Math.min(1, n) - 1e-9); hasta = Math.ceil(F.clases_antes + n - 1e-9); }
  return (hasta > desde ? `Clases ${desde}–${hasta}` : `Clase ${desde}`) + (n % 1 ? ` · ${clasesTxt(n)}` : '');
};

const iniciales = n => { const p = String(n || '').trim().split(/\s+/).filter(Boolean); return p.length ? (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase() : '?'; };
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// ─── SUPABASE / AUTENTICACIÓN ────────────────────────────────────────────────
let supabaseClient = null;
async function initSupabase() {
  if (supabaseClient) return supabaseClient;
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return supabaseClient;
}

async function apiFetch(url, options = {}) {
  await initSupabase();
  const { data: { session } } = await supabaseClient.auth.getSession();
  const headers = { ...(options.headers || {}) };
  if (session?.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
  const res = await fetch(url, { ...options, headers });
  if (res.status === 401) { cerrarSesion(); throw new Error('Sesión expirada'); }
  return res;
}
const postJSON = (url, cuerpo) => apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });

async function checkSession() {
  await initSupabase();
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { mostrarLogin(); return; }
  const guardado = localStorage.getItem(PROFESOR_KEY);
  if (guardado) {
    try { S.perfil = JSON.parse(guardado); entrarApp(); return; } catch { /* JSON inválido: pedimos perfil */ }
  }
  mostrarPerfiles();
}

  document.getElementById('app').hidden = true; document.getElementById('profile-screen').hidden = true;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('login-password').value = '';

async function mostrarPerfiles() {
  ocultarAcceso(); document.getElementById('app').hidden = true; document.getElementById('app').classList.remove('on-app');
  document.getElementById('profile-screen').hidden = false; setTema(false);
  const lista = document.getElementById('profesores-list');

  } catch { S.profesores = []; error = true; }
  let html = '';
  if (error) html += '<div class="msg msg-warn">No se pudo cargar la lista de profesores. Puedes continuar sin perfil.</div>';
  else if (!S.profesores.length) html += '<div class="vacio">Esta autoescuela aún no tiene profesores dados de alta.</div>';
  else html += S.profesores.map(p => `<button class="perfil-op" data-id="${p.id}"><span class="ini">${esc(iniciales(p.nombre))}</span>${esc(p.nombre)}<span class="chev">${ic('chev', 22)}</span></button>`).join('');
  html += `<button class="perfil-op" id="perfil-sin"><span class="ini">${ic('persona', 22)}</span>Sin profesor<span class="chev">${ic('chev', 22)}</span></button>`;

  lista.querySelectorAll('.perfil-op[data-id]').forEach(b => b.addEventListener('click', () => {

function elegirPerfil(id, nombre) { S.perfil = { id, nombre }; localStorage.setItem(PROFESOR_KEY, JSON.stringify(S.perfil)); entrarApp(); }

async function iniciarSesion() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (!email || !password) { err.textContent = 'Introduce tu email y contraseña.'; return; }
  err.textContent = '';
  try {
    await initSupabase();
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = /invalid|credentials|password|email/i.test(error.message || '') ? 'Email o contraseña incorrectos' : error.message; return; }
    localStorage.removeItem(PROFESOR_KEY); S.perfil = null;
    await mostrarPerfiles();
  } catch { err.textContent = 'Error de conexión'; }
}

document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') iniciarSesion(); });

const VISTAS_TAB = { hoy: 'hoy', alumnos: 'alumnos', historial: 'historial' };

  if (vista === 'alumnos' && Date.now() - S.ultimaCarga > 30000) cargarBase().then(() => { if (S.vista === 'alumnos') renderAlumnos(); });

});

async function cargarBase() {
  try {
    const [rv, ra, rc] = await Promise.all([apiFetch('/api/vehiculos'), apiFetch('/api/alumnos?resumen=1'), apiFetch('/api/config').catch(() => null)]);
    if (!rv.ok) throw new Error('Error cargando vehículos');
    if (!ra.ok) throw new Error('Error cargando alumnos');
    S.vehiculos = await rv.json(); S.alumnos = await ra.json();
    if (rc && rc.ok) { const c = await rc.json(); S.zonas = Array.isArray(c.zonas) ? c.zonas : []; S.duracionClase = parseInt(c.duracion_clase_min) || 45; }
    S.ultimaCarga = Date.now();
  } catch (e) { if (e.message !== 'Sesión expirada') toast('No se pudieron cargar los datos. Reintenta.'); }
  const guardado = parseInt(localStorage.getItem(VEHICULO_KEY));
  S.vehId = S.vehiculos.some(v => v.id === guardado) ? guardado : (S.vehiculos[0] ? S.vehiculos[0].id : null);
}
// La fecha de «hoy» se recalcula siempre: una web abierta desde antes de
// medianoche seguía pidiendo el día anterior y la jornada salía vacía.
function actualizarHoy() {
  const nuevo = fechaLocal();
  if (nuevo === S.hoy) return false;
  if (S.fecha === S.hoy) S.fecha = nuevo; // si se miraba «hoy», se pasa al nuevo día
  S.hoy = nuevo;
  return true;
}
async function pedirJornada(fecha) {
  const q = new URLSearchParams({ fecha, hoy: S.hoy });
  if (S.perfil && S.perfil.id) q.set('profesor_id', S.perfil.id);
  const res = await apiFetch('/api/hoy?' + q);
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || 'Error al cargar la jornada');
  return { practicas: data.practicas, sin_cerrar: data.sin_cerrar || [], reservas: data.reservas };
}
async function cargarJornada() {
  actualizarHoy();
  try {
    S.jornada = await pedirJornada(S.fecha);
    S.jornadaHoy = S.fecha === S.hoy ? S.jornada : await pedirJornada(S.hoy);
  } catch (e) { if (e.message !== 'Sesión expirada') toast(e.message || 'No se pudo cargar la jornada'); }
  // Si el servidor dice que hay una práctica en curso y aquí no hay flujo, se recupera.
  const enCurso = S.jornadaHoy.practicas.find(p => p.en_curso) || S.jornadaHoy.sin_cerrar[0];
  if (enCurso && (!S.flujo || S.flujo.practica_id !== enCurso.id)) {
    if (!S.flujo || !S.flujo.practica_id) S.flujo = flujoDesdePractica(enCurso);
    guardarFlujo();
  }
}
function flujoDesdePractica(p) {
  const inicioMs = (() => { if (!p.hora_inicio || p.fecha !== S.hoy) return Date.now(); const [h, m] = p.hora_inicio.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); })();
  return {
    practica_id: p.id, alumno_id: p.alumno_id, alumno_nombre: p.alumno_nombre, vehiculo_id: p.vehiculo_id, vehiculo_nombre: p.vehiculo_nombre, matricula: p.matricula,
    km_inicial: p.km_inicial, km_final: p.km_final || 0, inicio_ms: inicioMs, hora_inicio: p.hora_inicio, hora_fin: p.hora_fin || null,
    n_clases: nClasesGuardado(), duracion_min: nClasesGuardado() * durClase(), zonas: (p.zonas || []).slice(), trabajado: p.trabajado || [], observacion: '',
    clase_n: p.clase_n, fecha: p.fecha, cerrada: !!p.km_final, sin_cerrar: !!p.sin_cerrar, profesor_nombre: p.profesor_nombre || null
  };
}
function guardarFlujo() { try { if (S.flujo) localStorage.setItem(FLUJO_KEY, JSON.stringify(S.flujo)); else localStorage.removeItem(FLUJO_KEY); } catch {} }
function cargarFlujo() { try { const r = localStorage.getItem(FLUJO_KEY); S.flujo = r ? JSON.parse(r) : null; } catch { S.flujo = null; } }
const vehiculo = id => S.vehiculos.find(v => v.id === id);
const alumno = id => S.alumnos.find(a => a.id === id);
const nombreAlumno = a => a ? [a.nombre, a.primer_apellido, a.segundo_apellido].filter(Boolean).join(' ') : '';
// Clases y km TOTALES del alumno: las de la app + su punto de partida (lo que
// hizo antes de usar la app, se configura en el escritorio).
const clasesAlumno = a => a ? (a.clases || 0) + (a.clases_previas || 0) : 0;
// Nº de la próxima clase (las fracciones suman lo que valen: tras 7 ½ va la 9.ª)
const siguienteClase = a => Math.ceil(clasesAlumno(a) + 1 - 1e-9);
const kmAlumno = a => a ? (a.km || 0) + (a.km_previos || 0) : 0;
const zonasTxt = z => (z && z.length ? z.join(' · ') : '');

// Refresco al volver a la web (el móvil la deja en segundo plano horas) y al
// cambiar de día: datos nuevos del escritorio (alumnos, asignaciones, zonas).
async function refrescar({ silencioso = true } = {}) {
  if (!S.perfil) return;
  await cargarBase(); await cargarJornada();
  if (S.vista === 'hoy') renderHoy();
  else if (S.vista === 'alumnos') renderAlumnos();

  if (!silencioso) toast('Datos actualizados');

  if (['curso', 'kmfinal', 'firma', 'iniciar'].includes(S.vista)) { actualizarHoy(); return; }
  if (Date.now() - S.ultimaCarga > 30000 || actualizarHoy()) refrescar();

function pendientesReservas(j = S.jornada) {
  const yaHechos = new Set(j.practicas.map(p => p.alumno_id));
  return j.reservas.filter(r => !yaHechos.has(r.alumno_id));
}
function resumenJornada(j = S.jornada) {
  const cerradas = j.practicas.filter(p => !p.en_curso && !p.sin_cerrar);
  const enCurso = j.practicas.filter(p => p.en_curso);
  const pend = pendientesReservas(j);
  const total = j.practicas.length + pend.length;
  const km = cerradas.reduce((s, p) => s + (p.km || 0), 0);
  return { cerradas, enCurso, pend, total, km, firmadas: cerradas.filter(p => p.firmada).length };
}
function segmentos(r) {
  const n = Math.min(r.total, 14);
  if (!n) return '';
  let html = '';
  for (let i = 0; i < n; i++) html += `<i class="${i < r.cerradas.length ? 'hecha' : (i < r.cerradas.length + r.enCurso.length ? 'curso' : '')}"></i>`;
  return `<div class="segs" aria-hidden="true">${html}</div>`;
}

}

// Clases seguidas de una misma sesión (mismo alumno y coche, km encadenados y
// mismo estado de firma: p. ej. 90 min guardados como 2 clases) se muestran y
// se firman juntas. Devuelve una fila por sesión con `ids` y `n`.
function agruparSesiones(lista) {
  const orden = lista.slice().sort((a, b) => (a.hora_inicio || '').localeCompare(b.hora_inicio || '') || a.km_inicial - b.km_inicial || a.id - b.id);
  const grupos = [];
  for (const p of orden) {
    const g = grupos[grupos.length - 1], u = g && g[g.length - 1];
    if (u && u.alumno_id === p.alumno_id && u.vehiculo_id === p.vehiculo_id && u.km_final > 0 && u.km_final === p.km_inicial && !!u.firmada === !!p.firmada) g.push(p);
    else grupos.push([p]);
  }
  return grupos.map(g => ({ ...g[0], ids: g.map(x => x.id), n: g.reduce((t, x) => t + (x.fraccion || 1), 0), km_final: g[g.length - 1].km_final, hora_fin: g[g.length - 1].hora_fin, km: g.reduce((t, x) => t + (x.km || 0), 0) }));
}

function abrirIniciar(op = {}) {

function digitos(valor, largo = 6) {
  const s = String(valor || '').replace(/\D/g, '').slice(0, 7).padStart(largo, '0');
  const primerNoCero = s.search(/[1-9]/);
  return `<div class="odo-cajas">${[...s].map((c, i) => `<span class="${(primerNoCero === -1 || i < primerNoCero) ? 'cero' : ''}">${c}</span>`).join('')}</div>`;
}
function msgContinuidad(vid, km) {
  const v = vehiculo(vid); const u = v && v.ultimo;
  km = parseInt(km) || 0;
  if (!u || !u.km_final) return { cls: 'msg-gris', txt: 'No hay una práctica anterior registrada con este coche.' };
  const quien = `${u.alumno ? esc(u.alumno) : 'práctica anterior'}${u.hora ? ', ' + esc(u.hora) : ''}`;
  if (!km) return { cls: 'msg-gris', txt: `El coche terminó la última práctica en el km ${miles(u.km_final)} (${quien}).` };
  const d = km - u.km_final;
  if (d === 0) return { cls: 'msg-ok', ok: true, txt: `Coincide con el km final de la práctica anterior (${quien}).` };
  if (d > 0) return { cls: 'msg-warn', txt: `Hay ${miles(d)} km sin registrar desde la práctica anterior (terminó en el km ${miles(u.km_final)}, ${quien}).` };
  return { cls: 'msg-err', txt: `Es ${miles(-d)} km menos que el final de la práctica anterior (${miles(u.km_final)}). Revisa el número.` };
}

// Vuelve a donde se abrió, enseñando el día de la clase anotada.
async function volverDeAnotar(volverA, fecha, alumnoId) {

    S.cal.mes = mesDe(fecha); S.cal.dia = fecha; S.cal.autoDia = false; S.cal.cache = {};

// Firma en el momento: el mismo flujo que «Firmar ahora» del detalle de la clase
// (agrupa las clases de la sesión si se anotaron varias).
async function firmarAnotada(id, volverA) {
  try {
    const res = await apiFetch('/api/practica-detalle?id=' + id);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo abrir la clase');
    S.detalle = data.practica;
    firmarDesdeDetalle();
    if (S.flujo) { S.flujo.volverA = volverA || 'hoy'; guardarFlujo(); }
    if (!volverA || volverA === 'hoy') S.fecha = data.practica.fecha; // al terminar, Hoy enseña el día de la clase
    if (volverA === 'historial' && S.cal) { S.cal.mes = mesDe(data.practica.fecha); S.cal.dia = data.practica.fecha; S.cal.autoDia = false; }
  } catch (e) { if (e.message !== 'Sesión expirada') { cerrarHoja(); toast(e.message); } }
}

// ─── EN CURSO ────────────────────────────────────────────────────────────────
async function continuarPractica(id) {
  let p = S.jornada.practicas.find(x => x.id === id) || S.jornada.sin_cerrar.find(x => x.id === id) ||
    S.jornadaHoy.practicas.find(x => x.id === id) || S.jornadaHoy.sin_cerrar.find(x => x.id === id);
  if (!p) return;
  if (!S.flujo || S.flujo.practica_id !== id) { S.flujo = flujoDesdePractica(p); guardarFlujo(); }
  if (p.km_final) {
    const J = S.jornada.practicas.some(x => x.id === id) ? S.jornada : S.jornadaHoy;
    const ses = agruparSesiones(J.practicas.filter(x => x.km_final > 0)).find(g => g.ids.includes(id));
    const F = S.flujo;
    F.cerrada = true; F.km_final = p.km_final;
    if (ses && ses.ids.length > 1) Object.assign(F, { practica_id: ses.ids[0], practica_ids: ses.ids, n_clases: ses.n, clase_n: ses.clase_n, km_inicial: ses.km_inicial, km_final: ses.km_final, hora_inicio: ses.hora_inicio, hora_fin: ses.hora_fin });
    else Object.assign(F, { practica_ids: [p.id], n_clases: p.fraccion || 1 });
    guardarFlujo(); go('firma'); return;
  }
  go('curso');
}
function pararTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function pararTimerSiNoCurso(vista) { if (vista !== 'curso') pararTimer(); }
function tiempoTxt(seg) { const m = Math.floor(seg / 60), s = seg % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }

    <div class="ahora-quien" style="margin-top:6px"><span class="ini" style="background:#2A2D35;color:#F3F2EE;width:54px;height:54px">${esc(iniciales(F.alumno_nombre))}</span><div><div class="ahora-nom">${esc(F.alumno_nombre)}</div><div class="ahora-sub">${esc(claseTxt(F))}${F.zonas && F.zonas.length ? ' · ' + esc(zonasTxt(F.zonas)) : ''}</div></div></div>

    <div class="mini2"><div class="mini"><span class="etq2">KM INICIAL</span><span class="val">${miles(F.km_inicial)}</span></div>
      <div class="mini"><span class="etq2">VEHÍCULO</span><span>${placa(F.matricula) || esc(F.vehiculo_nombre)}</span></div></div>
    ${zonasCurso().length ? `<div class="etq" style="color:#A3A6AE">Zonas recorridas</div>
    <div class="chips chips-osc" id="zonas-curso">${zonasCurso().map((z, i) => `<button class="chip ${(F.zonas || []).includes(z) ? 'on' : ''}" onclick="toggleZonaCurso(${i},this)">${(F.zonas || []).includes(z) ? ic('ok', 16, 'style="stroke-width:2.6"') : ''}${esc(z)}</button>`).join('')}</div>` : ''}
    <div class="etq" style="color:#A3A6AE">Qué se ha trabajado <small id="trab-n" style="color:#A3A6AE"></small></div>
    <div class="chips chips-osc">${TRABAJADO.map(t => `<button class="chip ${F.trabajado.includes(t) ? 'on' : ''}" onclick="toggleTrabajado('${t}',this)">${F.trabajado.includes(t) ? ic('ok', 16, 'style="stroke-width:2.6"') : ''}${esc(t)}</button>`).join('')}</div>
    <button class="dash-btn" id="btn-obs" onclick="abrirObservacion()">${ic('lapiz', 18)} ${F.observacion ? 'Editar observación' : 'Añadir observación'}</button>
    <div id="obs-vista" style="margin-top:10px;color:#C9CBD1;font-size:15px">${F.observacion ? esc(F.observacion) : ''}</div>
    <div class="barra-fija"><button class="btn btn-pri btn-lg" onclick="abrirKmFinal()">${ic('stop', 16)} Finalizar práctica</button></div>`;
  actualizaTrabN();
  pararTimer(); tickCrono();
  S.timer = setInterval(tickCrono, 1000);
}
function tickCrono() {
  const F = S.flujo; if (!F || S.vista !== 'curso') { pararTimer(); return; }
  const seg = Math.max(0, Math.floor((Date.now() - F.inicio_ms) / 1000));
  const t = document.getElementById('crono-t'); if (!t) return;
  t.textContent = tiempoTxt(seg);
  const dur = (F.duracion_min || 45) * 60;
  document.getElementById('crono').classList.toggle('pasado', seg > dur);
  document.getElementById('barra-t').style.width = Math.min(100, (seg / dur) * 100) + '%';
}
// Zonas configuradas + las que ya tuviera marcadas la práctica (por si se
// quitaron de la configuración a mitad de clase).
function zonasCurso() {
  const F = S.flujo || {};
  return [...S.zonas, ...(F.zonas || []).filter(z => !S.zonas.includes(z))];
}
function toggleZonaCurso(i, btn) {
  const F = S.flujo; const z = zonasCurso()[i]; if (!F || !z) return;
  if (!F.zonas) F.zonas = [];

  if (k >= 0) F.zonas.splice(k, 1); else F.zonas.push(z);
  guardarFlujo();
  btn.classList.toggle('on', k < 0);
  btn.innerHTML = (k < 0 ? ic('ok', 16, 'style="stroke-width:2.6"') : '') + esc(z);
}
function actualizaTrabN() { const n = S.flujo.trabajado.length; const el = document.getElementById('trab-n'); if (el) el.textContent = n ? `${n} marcado${n === 1 ? '' : 's'}` : ''; }
function toggleTrabajado(t, btn) {
  const F = S.flujo; const i = F.trabajado.indexOf(t);
  if (i >= 0) F.trabajado.splice(i, 1); else F.trabajado.push(t);
  guardarFlujo();
  btn.classList.toggle('on', i < 0);
  btn.innerHTML = (i < 0 ? ic('ok', 16, 'style="stroke-width:2.6"') : '') + esc(t);
  actualizaTrabN();
}
function abrirObservacion() {

    <div class="card"><button class="fila" onclick="cerrarHoja();go('hoy')"><span class="veh-ic">${ic('atras', 22)}</span><div class="fila-tit" style="flex:1">Volver a Hoy (la práctica sigue en marcha)</div></button>
    <button class="fila" onclick="cancelarCurso()"><span class="veh-ic" style="background:var(--err-soft);color:var(--err)">${ic('cerrar', 22)}</span><div class="fila-tit" style="flex:1;color:var(--err)">Cancelar esta práctica</div></button></div>`);

async function cancelarCurso() {

    await cargarBase(); await cargarJornada(); go('hoy');

// ─── KM FINAL ────────────────────────────────────────────────────────────────
function abrirKmFinal() { const F = S.flujo; S.kmFinal = ''; pararTimer(); go('kmfinal'); }
// ─── CANTIDAD DE CLASES: de ¼ en ¼ o por minutos ────────────────────────────
// «Clases»: clases enteras (− / +) y, si hace falta, ¼, ½ o ¾ más.
// «Minutos»: se escriben los minutos y se calculan las clases sumando los que
// el alumno tenía acumulados; lo que no llega a ¼ queda para la próxima (lo
// guarda la nube al cerrar la clase). Sirve a Finalizar (S.flujo) y a Anotar
// (S.anotar): obj.modo, obj.n_clases, obj.minutos.
const MODO_CLASES_KEY = 'km_modo_clases';
const modoGuardado = () => localStorage.getItem(MODO_CLASES_KEY) === 'minutos' ? 'minutos' : 'clases';
const minutosAlumno = a => Math.max(0, Number(a && a.minutos_sobrantes) || 0);
const minTxt = m => `${String(Math.round(m * 100) / 100).replace('.', ',')} min`;
function calcMinutos(min, acum) {
  const cuarto = durClase() / 4, total = (parseInt(min) || 0) + acum;
  const cuartos = Math.min(MAX_CLASES * 4, Math.floor(total / cuarto + 1e-9));
  return { cantidad: cuartos / 4, sobran: Math.round((total - cuartos * cuarto) * 100) / 100, total, cuarto };
}
const objCantidad = quien => quien === 'flujo' ? S.flujo : S.anotar;
// Clases que se guardarán
function cantidadDe(obj) {
  if (obj.modo === 'minutos') return calcMinutos(obj.minutos, minutosAlumno(alumno(obj.alumno_id))).cantidad;
  return obj.n_clases || 1;
}
// Minutos que dura lo que se guarda (para la hora de fin)
const minutosDe = obj => obj.modo === 'minutos' ? (parseInt(obj.minutos) || 0) : (obj.n_clases || 1) * durClase();
function msgMinutos(obj) {
  const al = alumno(obj.alumno_id), acum = minutosAlumno(al), m = parseInt(obj.minutos) || 0;
  const quien = al ? esc(nombreAlumno(al).split(' ')[0]) : 'El alumno';
  if (!m) return ['msg-gris', `<span>Escribe los minutos que ha durado.${acum ? ` ${quien} tiene ${minTxt(acum)} acumulados de otras clases.` : ''}</span>`];
  const c = calcMinutos(m, acum);
  if (c.cantidad < 0.25) return ['msg-err', `<span>${minTxt(c.total)} no llegan a ¼ de clase (${minTxt(c.cuarto)}).</span>`];
  return ['msg-ok', `<span>${minTxt(m)}${acum ? ` + ${minTxt(acum)} acumulados` : ''} = <b>${clasesTxt(c.cantidad)}</b>${c.sobran ? ` · sobran ${minTxt(c.sobran)} para la próxima` : ''}</span>`];
}
function bloqueCantidad(obj, quien, sugerencia = '') {
  const modo = obj.modo === 'minutos' ? 'minutos' : 'clases';
  const cab = `<div class="seg3 cant-modo" role="group" aria-label="Cómo contar las clases"><button class="${modo === 'clases' ? 'on' : ''}" onclick="fijarModoCantidad('${quien}','clases')">Clases</button><button class="${modo === 'minutos' ? 'on' : ''}" onclick="fijarModoCantidad('${quien}','minutos')">Minutos</button></div>`;
  if (modo === 'minutos') {
    const [cls, html] = msgMinutos(obj);
    return `<div class="card cant">${cab}
      <div class="cant-min"><input class="campo" id="cant-min" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="${esc(obj.minutos || '')}" placeholder="0" oninput="tecleaMinutos(this,'${quien}')" aria-label="Minutos de clase"><span>min</span></div>
      <div class="msg ${cls}" id="cant-msg" style="margin-top:10px">${html}</div></div>`;
  }
  const n = obj.n_clases || 1, ent = Math.floor(n), q = Math.round((n - ent) * 4);
  return `<div class="card cant">${cab}
    <div class="nclases"><div style="flex:1;min-width:0"><div class="fila-tit">Se ${n > 1 ? 'guardan' : 'guarda'} ${clasesTxt(n)}</div><div class="fila-sub">${durTxt(n * durClase())} · clases de ${durClase()} min</div>${sugerencia}</div>
      <div class="paso-n"><button onclick="fijarCantidad('${quien}',${n - 1})" ${n - 1 < 0.25 ? 'disabled' : ''} aria-label="Una clase menos">−</button><b>${ent}</b><button onclick="fijarCantidad('${quien}',${n + 1})" ${n + 1 > MAX_CLASES ? 'disabled' : ''} aria-label="Una clase más">+</button></div></div>
    <div class="seg3 cant-frac" role="group" aria-label="Fracción de clase">${['—', '¼', '½', '¾'].map((t, k) => `<button class="${k === q ? 'on' : ''}" onclick="fijarCantidad('${quien}',${ent + k / 4})" ${ent + k / 4 < 0.25 ? 'disabled' : ''} aria-label="${k ? 'Y ' + t + ' de clase' : 'Sin fracción'}">${k ? (ent ? '+ ' + t : t) : (ent > 1 ? 'Enteras' : ent ? 'Entera' : t)}</button>`).join('')}</div></div>`;
}
function fijarCantidad(quien, n) {
  const o = objCantidad(quien); if (!o) return;
  o.n_clases = Math.min(MAX_CLASES, Math.max(0.25, aCuartos(n)));
  if (quien === 'flujo') { o.duracion_min = o.n_clases * durClase(); guardarFlujo(); renderKmFinal(); } else renderAnotar();
}
function fijarModoCantidad(quien, modo) {
  const o = objCantidad(quien); if (!o) return;
  o.modo = modo; localStorage.setItem(MODO_CLASES_KEY, modo);
  // Minutos: se propone lo que marca el cronómetro (o lo de las clases elegidas)
  if (modo === 'minutos' && !o.minutos) o.minutos = String(quien === 'flujo' && o.inicio_ms ? Math.max(1, Math.round((Date.now() - o.inicio_ms) / 60000)) : Math.round((o.n_clases || 1) * durClase()));
  if (quien === 'flujo') { guardarFlujo(); renderKmFinal(); } else renderAnotar();
}
function tecleaMinutos(inp, quien) {
  inp.value = inp.value.replace(/\D/g, '').slice(0, 3);
  const o = objCantidad(quien); if (!o) return;
  o.minutos = inp.value;
  const [cls, html] = msgMinutos(o);
  const m = document.getElementById('cant-msg'); m.className = 'msg ' + cls; m.innerHTML = html;
  if (quien === 'flujo') { guardarFlujo(); pintarAvisoKmFinal(); } else pintarEstadoAnotar();
}

function estadoKmFinal() {
  const F = S.flujo, kf = parseInt(S.kmFinal) || 0, rec = kf ? kf - F.km_inicial : 0;
  const al = alumno(F.alumno_id), n = cantidadDe(F);
  const err = t => ({ ok: false, html: `<span style="color:var(--err);font-weight:600">${t}</span>` });
  if (kf && rec <= 0) return err(`El km final debe ser mayor que ${miles(F.km_inicial)}.`);
  if (n < 0.25) return { ok: false, html: 'Escribe los minutos de la clase (al menos ¼ de clase).' };
  if (kf && rec < Math.ceil(n - 1e-9)) return err(`Con ${rec} km no caben ${clasesTxt(n)}.`);
  if (!kf) return { ok: false, html: 'Escribe el km que marca el coche.' };
  const antes = F.clases_antes != null ? F.clases_antes : Math.max(0, (F.clase_n || 1) - 1);
  return { ok: true, html: al ? `Con ${n > 1 ? 'estas' : 'esta'}, ${esc(nombreAlumno(al).split(' ')[0])} suma <b>${clasesTxt(antes + n)}</b> y <b>${miles(kmAlumno(al) + rec)} km</b>.` : '' };
}
function pintarAvisoKmFinal() {
  const st = estadoKmFinal();
  const a = document.getElementById('km-aviso'); if (a) a.innerHTML = st.html;
  const b = document.getElementById('btn-firma'); if (b) b.disabled = !st.ok;
}
function renderKmFinal() {
  const F = S.flujo; if (!F) { go('hoy'); return; }
  if (!F.modo) F.modo = modoGuardado();
  const kf = parseInt(S.kmFinal) || 0;
  const rec = kf ? kf - F.km_inicial : 0;
  const minutos = Math.max(1, Math.round((Date.now() - F.inicio_ms) / 60000));
  if (F.modo === 'minutos' && !F.minutos) F.minutos = String(minutos);
  const n = F.n_clases || 1;
  const sugeridas = Math.min(MAX_CLASES, Math.max(0.25, aCuartos(minutos / durClase())));
  const sugerencia = sugeridas !== n ? `<button class="lnk" style="font-size:14px;margin-top:2px" onclick="fijarCantidad('flujo',${sugeridas})">Han pasado ${minutos} min: ¿${clasesTxt(sugeridas)}?</button>` : '';
  const st = estadoKmFinal();
  document.getElementById('v-kmfinal').innerHTML = `
    <div class="cab"><div class="cab-tit"><button class="cab-atras" onclick="go('curso')" aria-label="Volver">${ic('atras', 26)}</button><h1>Finalizar práctica</h1></div><span class="pill">Paso 1 de 2</span></div>
    <div class="card veh-card"><span class="ini">${esc(iniciales(F.alumno_nombre))}</span><div style="flex:1;min-width:0"><div class="fila-tit">${esc(F.alumno_nombre)}</div><div class="fila-sub mono">${esc(F.hora_inicio)} – ${esc(hhmm())} · ${minutos} min</div></div>${placa(F.matricula)}</div>
    ${bloqueCantidad(F, 'flujo', sugerencia)}
    <div class="card card-pad" style="margin-top:12px"><div class="etq" style="margin:0 0 10px">Km final <small>Lo que marca el coche ahora</small></div>
      <div class="odo">${digitos(S.kmFinal || '')}<span class="odo-km">km</span></div>
      <div class="dos-col"><div class="stat-box"><span class="etq2">Inicial</span><span class="val">${miles(F.km_inicial)}</span></div>
        <div class="stat-box osc"><span class="etq2">Recorridos</span><span class="val">${kf ? (rec > 0 ? '+' + rec : rec) + ' km' : '—'}</span></div></div>
      <div id="km-aviso" class="fila-sub" style="margin-top:10px">${st.html}</div></div>
    <div class="teclado">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="tecla('${n}')">${n}</button>`).join('')}
      <button class="f" onclick="tecla('C')">Borrar</button><button onclick="tecla('0')">0</button><button class="f" onclick="tecla('<')" aria-label="Borrar un dígito">${ic('borrar', 26)}</button></div>
    <div class="barra-fija"><button class="btn btn-pri btn-lg" id="btn-firma" onclick="continuarFirma()" ${st.ok ? '' : 'disabled'}>Continuar a la firma ${ic('flecha', 20)}</button></div>`;
}
function tecla(k) {
  if (k === 'C') S.kmFinal = ''; else if (k === '<') S.kmFinal = S.kmFinal.slice(0, -1); else if (S.kmFinal.length < 7) S.kmFinal += k;
  renderKmFinal();
}
async function continuarFirma() {
  const F = S.flujo; const kf = parseInt(S.kmFinal) || 0;
  if (!estadoKmFinal().ok) return;
  const porMinutos = F.modo === 'minutos';
  if (kf - F.km_inicial > 300 && !confirm(`Son ${kf - F.km_inicial} km en una sola práctica. ¿Es correcto?`)) return;
  const btn = document.getElementById('btn-firma'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const res = await postJSON('/api/finalizar-practica', {
      practica_id: F.practica_id, km_final: kf, trabajado: F.trabajado, observacion: F.observacion, hora_fin: hhmm(),
      zonas: F.zonas || [], ...(porMinutos ? { minutos: parseInt(F.minutos) } : { n_clases: F.n_clases || 1 })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cerrar la práctica');
    F.km_final = kf; F.hora_fin = hhmm(); F.cerrada = true; F.resumen = data.alumno; F.recorridos = data.recorridos; F.campos_guardados = data.campos_guardados;
    F.practica_ids = Array.isArray(data.practica_ids) && data.practica_ids.length ? data.practica_ids : [F.practica_id];
    F.n_clases = data.clases || cantidadDe(F);
    guardarFlujo();
    // refresca datos locales del alumno y del vehículo
    const al = alumno(F.alumno_id); if (al && data.alumno) { al.clases = data.alumno.clases; al.km = data.alumno.km; }
    if (al && data.minutos_sobrantes !== undefined) {
      al.minutos_sobrantes = data.minutos_sobrantes;
      if (data.minutos_sobrantes > 0) toast(`${clasesTxt(F.n_clases)} guardadas. A ${nombreAlumno(al).split(' ')[0]} le quedan ${minTxt(data.minutos_sobrantes)} acumulados para la próxima.`, 4200);
    }
    const v = vehiculo(F.vehiculo_id); if (v) { v.km_actual = Math.max(v.km_actual || 0, kf); v.ultimo = { km_final: kf, hora: F.hora_inicio, alumno: F.alumno_nombre, fecha: F.fecha }; }
    go('firma');
  } catch (e) { if (e.message !== 'Sesión expirada') { toast(e.message); btn.disabled = false; btn.innerHTML = 'Continuar a la firma ' + ic('flecha', 20); } }
}

const horaAMin = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return a * 60 + b; };
function iniciarLienzo() {
  lienzo = document.getElementById('firma-cv'); if (!lienzo) return;
  const caja = document.getElementById('firma-caja');
  const dpr = window.devicePixelRatio || 1;
  const w = caja.clientWidth, h = caja.clientHeight;
  lienzo.width = w * dpr; lienzo.height = h * dpr;
  ctx = lienzo.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14161B';
  S.firmaTrazos = 0; S.firmaCaja = null;
  const punto = e => {
    const r = lienzo.getBoundingClientRect(); const p = { x: e.clientX - r.left, y: e.clientY - r.top };
    const c = S.firmaCaja || (S.firmaCaja = { x0: p.x, y0: p.y, x1: p.x, y1: p.y });
    c.x0 = Math.min(c.x0, p.x); c.y0 = Math.min(c.y0, p.y); c.x1 = Math.max(c.x1, p.x); c.y1 = Math.max(c.y1, p.y);

    const p = punto(e); const m = { x: (ultimoPunto.x + p.x) / 2, y: (ultimoPunto.y + p.y) / 2 };

    ctx.beginPath(); ctx.moveTo(ultimoMedio.x, ultimoMedio.y); ctx.quadraticCurveTo(ultimoPunto.x, ultimoPunto.y, m.x, m.y); ctx.stroke();

function borrarFirma() {

function firmaComoPNG(anchoMax = 480) {
  // Se recorta al contorno de lo dibujado (sin el blanco sobrante) y se reduce
  // a un PNG pequeño: suele quedar en 5-25 KB.
  const dpr = lienzo.width / (lienzo.clientWidth || lienzo.width) || 1;

  tmp.getContext('2d').drawImage(lienzo, x0 * dpr, y0 * dpr, w * dpr, h * dpr, 0, 0, tmp.width, tmp.height);

}

    S.ficha = { id, datos: data };
    const ult = data.fechas && data.fechas[0] ? data.fechas[0] : S.hoy;
    S.fichaMes = ult.slice(0, 7);

    <div class="card">${filas || '<div class="vacio">Todavía no tiene prácticas.</div>'}</div>

    <div class="barra-fija"><button class="btn btn-pri btn-lg" onclick="abrirIniciar({alumno_id:${a.id},vehiculo_id:${a.vehiculo_id || 'null'}})">${ic('play', 18)} Iniciar práctica con ${esc((a.nombre || '').split(' ')[0])}</button></div>`;
}
function mesFicha(n) { const [y, m] = S.fichaMes.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); S.fichaMes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; renderFicha(); }

// ─── NUEVO ALUMNO ────────────────────────────────────────────────────────────
function renderNuevo() {
  document.getElementById('v-nuevo').innerHTML = `
    <div class="cab"><div class="cab-tit"><button class="cab-atras" onclick="volver()" aria-label="Volver">${ic('atras', 26)}</button><h1>Nuevo alumno</h1></div></div>
    <div class="card card-pad" style="display:flex;flex-direction:column;gap:12px">
      <div><div class="etq" style="margin:0 0 6px">Nombre completo</div><input class="campo" id="n-nombre" placeholder="Nombre y apellidos" autocomplete="off"></div>
      <div><div class="etq" style="margin:0 0 6px">Permiso</div><select class="campo" id="n-permiso"><option value="B">B (Coche)</option><option value="A">A (Moto)</option><option value="A2">A2</option><option value="AM">AM</option><option value="C">C (Camión)</option></select></div>
      <div><div class="etq" style="margin:0 0 6px">Vehículo asignado</div><select class="campo" id="n-vehiculo"><option value="">— Sin asignar —</option>${S.vehiculos.map(v => `<option value="${v.id}">${esc(v.nombre)}${v.matricula ? ' (' + esc(v.matricula) + ')' : ''}</option>`).join('')}</select></div>
      <label style="display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600"><input type="checkbox" id="n-mio" ${S.perfil && S.perfil.id ? 'checked' : 'disabled'} style="width:22px;height:22px"> Asignármelo a mí${S.perfil && S.perfil.id ? '' : ' (elige un perfil de profesor)'}</label>
      <div class="err-txt" id="n-error" role="alert"></div>
    </div>
    <div class="barra-fija"><button class="btn btn-pri btn-lg" id="btn-nuevo" onclick="crearAlumno()">${ic('mas', 20)} Crear alumno</button></div>`;
}
async function crearAlumno() {
  const nombre = document.getElementById('n-nombre').value.trim(); const err = document.getElementById('n-error');
  if (!nombre) { err.textContent = 'Introduce el nombre del alumno.'; return; }
  err.textContent = ''; const btn = document.getElementById('btn-nuevo'); btn.disabled = true;
  try {
    const res = await postJSON('/api/crear-alumno', {
      nombre, permiso: document.getElementById('n-permiso').value, vehiculo_id: document.getElementById('n-vehiculo').value || null,
      profesor_id: document.getElementById('n-mio').checked && S.perfil ? S.perfil.id : null, hoy: fechaLocal()
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo crear el alumno');
    toast(data.cobros_error ? 'Alumno creado. La matrícula la anotará la oficina.' : 'Alumno creado', 3200); await cargarBase(); go('alumnos');
  } catch (e) { if (e.message !== 'Sesión expirada') { err.textContent = e.message; btn.disabled = false; } }
}

// ─── HISTORIAL EN CALENDARIO ─────────────────────────────────────────────────
// Mes a la vista con las clases de cada día (número en la celda; ámbar si falta
// alguna firma). Tocar un día lista sus clases; tocar una clase abre su detalle
// con la firma. Se desliza a los lados para cambiar de mes.
const mesDe = iso => iso.slice(0, 7);
function ultimoDiaMes(mes) { const [y, m] = mes.split('-').map(Number); return `${mes}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`; }
function renderHistorial() {
  if (!S.cal) S.cal = { mes: mesDe(S.hoy), dia: S.hoy, filtro: (S.perfil && S.perfil.id) ? 'mias' : 'todas', cache: {} };
  pintarHistorial();
  cargarCalendario();
}
async function cargarCalendario() {
  const C = S.cal; if (!C) return;
  const clave = C.mes + '|' + C.filtro;
  if (C.cache[clave]) { pintarHistorial(); return; }
  C.cargando = true; C.error = null; pintarHistorial();
  try {
    const q = new URLSearchParams({ desde: C.mes + '-01', hasta: ultimoDiaMes(C.mes), hoy: S.hoy });
    if (C.filtro === 'mias' && S.perfil && S.perfil.id) q.set('profesor_id', S.perfil.id);
    const res = await apiFetch('/api/calendario?' + q);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cargar el historial');
    C.cache[clave] = data.practicas;
  } catch (e) { if (e.message !== 'Sesión expirada') C.error = e.message || 'No se pudo cargar el historial'; }
  C.cargando = false;
  if (S.vista === 'historial' && C.mes + '|' + C.filtro === clave) pintarHistorial();
}
function pintarHistorial() {
  const C = S.cal; const cont = document.getElementById('v-historial'); if (!C || !cont) return;
  const cargado = C.cache[C.mes + '|' + C.filtro];
  const lista = cargado || [];
  const porDia = {};
  for (const p of lista) (porDia[p.fecha] || (porDia[p.fecha] = [])).push(p);
  // Al cambiar a otro mes se enseña su último día con clases.
  if (C.autoDia && cargado) { const dias = Object.keys(porDia).sort(); C.dia = dias.length ? dias[dias.length - 1] : C.mes + '-01'; C.autoDia = false; }
  const [y, m] = C.mes.split('-').map(Number);
  const primero = (new Date(y, m - 1, 1).getDay() + 6) % 7, ndias = new Date(y, m, 0).getDate();
  let celdas = '';
  for (let i = 0; i < primero; i++) celdas += '<span></span>';
  for (let d = 1; d <= ndias; d++) {
    const iso = `${C.mes}-${String(d).padStart(2, '0')}`;
    const ps = porDia[iso] || [];
    const falta = ps.some(p => p.km > 0 && !p.firmada);
    celdas += `<button class="dia ${ps.length ? 'con' : ''} ${iso === C.dia ? 'sel' : ''} ${iso === S.hoy ? 'hoy' : ''}" onclick="elegirDiaHist('${iso}')" aria-label="${esc(fechaLarga(iso))}${ps.length ? ', ' + ps.length + (ps.length === 1 ? ' clase' : ' clases') : ''}"><b>${d}</b>${ps.length ? `<i class="${falta ? 'pend' : ''}">${ps.length}</i>` : ''}</button>`;
  }
  const cerradas = lista.filter(p => p.km > 0);
  const kmMes = cerradas.reduce((t, p) => t + p.km, 0);
  const firmadas = cerradas.filter(p => p.firmada).length;
  const delDia = porDia[C.dia] || [];
  const filtros = S.perfil && S.perfil.id ? `<div class="chips" style="margin-bottom:12px">${[['mias', 'Mis clases'], ['todas', 'Toda la autoescuela']].map(([id, tx]) => `<button class="chip ${C.filtro === id ? 'on' : ''}" style="height:42px;font-size:15.5px" onclick="filtroHist('${id}')">${tx}</button>`).join('')}</div>` : '';
  cont.innerHTML = `
    <div class="cab"><div><div class="fecha-lin">Clases hechas</div><div class="grande" style="margin-top:4px">Historial</div></div>
      <button class="avatar" onclick="menuPerfil()" aria-label="Perfil y opciones">${esc(iniciales(S.perfil ? S.perfil.nombre : '?'))}</button></div>
    ${filtros}
    <div class="card cal cal-hist" id="cal-hist">
      <div class="cal-cab"><button onclick="mesHist(-1)" aria-label="Mes anterior">${ic('chevIzq', 20)}</button>
        <div style="text-align:center"><b>${cap(MESES[m - 1])} ${y}</b><div class="fila-sub">${!cargado ? (C.error ? 'Sin datos' : 'Cargando…') : `${cerradas.length} ${cerradas.length === 1 ? 'clase' : 'clases'} · <span class="mono">${miles(kmMes)}</span> km`}</div></div>
        <button onclick="mesHist(1)" aria-label="Mes siguiente">${ic('chev', 20)}</button></div>
      <div class="cal-sem"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-dias">${celdas}</div>
      <div class="leyenda"><span><i style="background:var(--ink)"></i>Clases</span><span><i style="background:var(--amber)"></i>Falta firma</span>${cerradas.length ? `<span style="margin-left:auto;font-weight:600;color:var(--ink)">${firmadas}/${cerradas.length} firmadas</span>` : ''}</div>
    </div>
    ${C.error ? `<div class="msg msg-err">${ic('aviso', 18)}<span>${esc(C.error)} <button class="lnk" onclick="S.cal.cache={};cargarCalendario()">Reintentar</button></span></div>` : ''}
    <div class="grupo-tit"><span>${esc(C.dia === S.hoy ? 'Hoy' : fechaLarga(C.dia))}</span><span style="font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)">${delDia.length ? `${delDia.length} ${delDia.length === 1 ? 'clase' : 'clases'} · ${miles(delDia.reduce((t, p) => t + p.km, 0))} km` : ''}</span></div>
    <div class="card">${delDia.length ? delDia.map(filaHist).join('') : `<div class="vacio">${!cargado && !C.error ? 'Cargando…' : 'Sin clases este día.'}</div>`}</div>
    ${C.dia <= S.hoy && C.dia >= sumaDias(S.hoy, -DIAS_ANOTAR) ? `<button class="btn btn-sec" style="margin-top:12px" onclick="abrirAnotar({fecha:'${C.dia}',volverA:'historial'})">${ic('mas', 20)} Anotar una clase olvidada este día</button>` : ''}`;
  activarSwipeHist();
}
function estadoPill(p) {
  if (p.en_curso) return '<span class="pill pill-dark"><span class="pill-dot"></span>En curso</span>';
  if (p.sin_cerrar) return '<span class="pill pill-warn">Sin cerrar</span>';
  if (!(p.km > 0)) return '<span class="pill pill-warn">Km pendientes</span>';
  return p.firmada ? `<span class="pill pill-ok">${ic('ok', 13, 'style="stroke-width:2.6"')} Firmada</span>` : '<span class="pill pill-warn">Sin firmar</span>';
}
function filaHist(p) {
  return `<button class="fila" onclick="abrirDetalle(${p.id})"><span class="fila-hora">${esc(p.hora_inicio || '--:--')}</span>
    <div style="flex:1;min-width:0"><div class="fila-tit">${esc(p.alumno_nombre)}</div>
    <div class="fila-sub"><span class="mono">${p.km > 0 ? miles(p.km_inicial) + ' → ' + miles(p.km_final) + ' · ' + p.km + ' km' : (p.km_inicial > 0 ? 'km ' + miles(p.km_inicial) : 'Sin km')}</span>${p.matricula ? ' · ' + esc(p.matricula) : ''}</div>
    ${p.zonas && p.zonas.length ? `<div class="fila-sub">${esc(zonasTxt(p.zonas))}</div>` : ''}</div>${estadoPill(p)}</button>`;
}
function elegirDiaHist(iso) { S.cal.dia = iso; S.cal.autoDia = false; pintarHistorial(); }
function filtroHist(id) { S.cal.filtro = id; cargarCalendario(); }
function mesHist(n) {
  const [y, m] = S.cal.mes.split('-').map(Number); const d = new Date(y, m - 1 + n, 1);
  S.cal.mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  if (S.cal.mes === mesDe(S.hoy)) { S.cal.dia = S.hoy; S.cal.autoDia = false; } else S.cal.autoDia = true;
  cargarCalendario();
}
function activarSwipeHist() {
  const el = document.getElementById('cal-hist'); if (!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) mesHist(dx < 0 ? 1 : -1);
  }, { passive: true });
}

// ─── DETALLE DE UNA CLASE (con la firma) ─────────────────────────────────────
const FIRMA_VALIDA = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
async function abrirDetalle(id) {
  abrirHoja(`<div class="hoja-tit"><h3>Clase</h3><button class="cab-atras" onclick="cerrarHoja()" aria-label="Cerrar">${ic('cerrar', 22)}</button></div><div class="cargando">Cargando…</div>`);
  try {
    const res = await apiFetch('/api/practica-detalle?id=' + id);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cargar la clase');
    pintarDetalle(data.practica);
  } catch (e) {
    if (e.message !== 'Sesión expirada') abrirHoja(`<div class="hoja-tit"><h3>Clase</h3><button class="cab-atras" onclick="cerrarHoja()" aria-label="Cerrar">${ic('cerrar', 22)}</button></div><div class="vacio">${esc(e.message)}</div>`);
  }
}
function pintarDetalle(p) {
  S.detalle = p;
  const dur = p.hora_inicio && p.hora_fin ? Math.max(1, horaAMin(p.hora_fin) - horaAMin(p.hora_inicio)) : null;
  const firmable = p.km_final > 0 && !p.firma;
  const fila = (etq, val, ancho) => `<div${ancho ? ' style="grid-column:1/-1"' : ''}><div class="etq2">${etq}</div><div class="val" style="font-size:16px">${val}</div></div>`;
  abrirHoja(`<div class="hoja-tit"><h3>Clase Nº ${p.clase_n}${p.fraccion ? ` <small class="fila-sub">· ${clasesTxt(p.fraccion)}</small>` : ''}</h3><button class="cab-atras" onclick="cerrarHoja()" aria-label="Cerrar">${ic('cerrar', 22)}</button></div>
    <div class="hoja-scroll">
      <div class="card rev-grid">
        ${fila('Alumno', esc(p.alumno_nombre) + (p.permiso ? ` <small class="fila-sub">· Permiso ${esc(p.permiso)}</small>` : ''), true)}
        ${fila('Fecha', `${esc(fechaCorta(p.fecha))} ${partes(p.fecha).y}${p.tipo_detalle === 'anotada' ? ' <span class="pill" style="font-size:12px;height:22px">Anotada después</span>' : ''}`)}
        ${fila('Horario', `<span class="mono">${esc(p.hora_inicio || '--:--')}${p.hora_fin ? ' - ' + esc(p.hora_fin) : ''}</span>${dur ? ` <small class="fila-sub">(${dur} min)</small>` : ''}`)}
        ${fila('Profesor', esc(p.profesor_nombre || '—'))}
        ${fila('Vehículo', placa(p.matricula) || esc(p.vehiculo_nombre || '—'))}
        ${fila('Km', `<span class="mono">${p.km_final > 0 ? miles(p.km_inicial) + ' → ' + miles(p.km_final) : (p.km_inicial > 0 ? miles(p.km_inicial) + ' → …' : '—')}</span>`)}
        ${fila('Recorridos', `<span class="mono">${p.km} km</span>`)}
        ${p.zonas.length ? fila('Zonas recorridas', esc(zonasTxt(p.zonas)), true) : ''}
        ${p.trabajado.length ? fila('Qué se ha trabajado', esc(p.trabajado.join(' · ')), true) : ''}
        ${p.nota ? fila('Observación', esc(p.nota), true) : ''}
      </div>
      <div class="etq" style="margin:10px 0 4px">Firma del alumno</div>
      ${p.firma && FIRMA_VALIDA.test(p.firma)
        ? `<div class="firma-vista"><img src="${p.firma}" alt="Firma de ${esc(p.alumno_nombre)}"></div>`
        : `<div class="msg msg-warn" style="margin-top:0">${ic('aviso', 18)}<span>${p.km_final > 0 ? 'Esta clase todavía no está firmada.' : (p.km_inicial > 0 ? 'La clase no está cerrada: falta el km final.' : 'Faltan los km: se rellenan desde la oficina y después se puede firmar.')}</span></div>`}
    </div>
    ${firmable ? `<button class="btn btn-pri btn-lg" onclick="firmarDesdeDetalle()">${ic('lapiz', 18)} ${p.sesion ? `Firmar las ${p.sesion.n} clases` : 'Firmar ahora'}</button>` : ''}
    ${p.cancelable ? `<button class="btn btn-sec" style="color:var(--err)" onclick="cancelarPractica(${p.id})">Cancelar esta práctica</button>` : ''}`);
}
function firmarDesdeDetalle() {
  const p = S.detalle; if (!p) return;
  if (S.flujo && S.flujo.practica_id && !S.flujo.cerrada && S.flujo.practica_id !== p.id) { toast('Termina primero la práctica en curso.'); return; }
  S.flujo = {
    practica_id: p.id, alumno_id: p.alumno_id, alumno_nombre: p.alumno_nombre, vehiculo_id: p.vehiculo_id, vehiculo_nombre: p.vehiculo_nombre, matricula: p.matricula,
    km_inicial: p.km_inicial, km_final: p.km_final, inicio_ms: Date.now(), hora_inicio: p.hora_inicio, hora_fin: p.hora_fin,
    zonas: p.zonas, trabajado: p.trabajado, observacion: '', clase_n: p.clase_n, fecha: p.fecha, cerrada: true,
    profesor_nombre: p.profesor_nombre, volverA: S.vista === 'ficha' ? 'ficha' : 'historial', practica_ids: [p.id], n_clases: p.fraccion || 1
  };
  const ses = p.sesion;
  if (ses && ses.ids.length > 1) Object.assign(S.flujo, { practica_id: ses.ids[0], practica_ids: ses.ids, n_clases: ses.n, clase_n: ses.clase_n_desde, km_inicial: ses.km_inicial, km_final: ses.km_final, hora_inicio: ses.hora_inicio || p.hora_inicio, hora_fin: ses.hora_fin || p.hora_fin });
  guardarFlujo(); cerrarHoja(); go('firma');
}
async function cancelarPractica(id) {
  const p = S.detalle;
  if (!confirm(`¿Cancelar la práctica de ${p ? p.alumno_nombre : 'este alumno'}? Se quita del historial y de los km.`)) return;
  try {
    const res = await postJSON('/api/cancelar-practica', { practica_id: id });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cancelar');
    if (S.flujo && S.flujo.practica_id === id) { S.flujo = null; guardarFlujo(); }
    cerrarHoja(); toast('Práctica cancelada');
    if (S.cal) S.cal.cache = {};
    await cargarBase(); await cargarJornada();
    if (S.vista === 'historial') cargarCalendario();
    else if (S.vista === 'ficha' && S.ficha) abrirFicha(S.ficha.id);
    else if (S.vista === 'hoy') renderHoy();
    renderRiel();
  } catch (e) { if (e.message !== 'Sesión expirada') toast(e.message); }
}

// ─── RIEL DE TABLET (jornada siempre a la vista) ─────────────────────────────
function renderRiel() {
  const cab = document.getElementById('riel-cab'); if (!cab || !window.matchMedia('(min-width:900px)').matches) return;
  const J = S.jornadaHoy;
  const r = resumenJornada(J);
  cab.innerHTML = `<div style="display:flex;align-items:flex-start;justify-content:space-between"><div><div class="fecha-lin">${esc(fechaLarga(S.hoy))}</div><div class="grande" style="margin-top:4px">Hoy</div>
    ${vehiculo(S.vehId) ? `<div style="margin-top:8px;display:flex;align-items:center;gap:8px">${placa(vehiculo(S.vehId).matricula)}<span class="fila-sub">${esc(vehiculo(S.vehId).nombre)} · <b class="mono" style="color:var(--ink)">${miles(kmSugerido(S.vehId))}</b> km</span></div>` : ''}</div>
    <button class="avatar" onclick="menuPerfil()" aria-label="Perfil y opciones">${esc(iniciales(S.perfil ? S.perfil.nombre : '?'))}</button></div>`;
  const filas = [];
  [...J.practicas.filter(p => !(p.km_final > 0)), ...agruparSesiones(J.practicas.filter(p => p.km_final > 0))].forEach(p => filas.push({ h: p.hora_inicio || '99', html: `<button class="riel-fila ${S.flujo && (S.flujo.practica_id === p.id || (S.flujo.practica_ids || []).includes(p.id)) && ['curso', 'kmfinal', 'firma'].includes(S.vista) ? 'activa' : ''}" onclick="continuarPractica(${p.id})"><span class="fila-hora">${esc(p.hora_inicio || '--:--')}</span><div style="flex:1;min-width:0"><div class="fila-tit" style="font-size:16px">${esc(p.alumno_nombre)}</div><div class="fila-sub">${p.en_curso ? 'en curso' : (p.n !== 1 ? clasesTxt(p.n) + ' · ' : '') + p.km + ' km'}</div></div>${p.en_curso ? '<span class="pill pill-dark">En curso</span>' : (p.firmada ? '<span class="pill pill-ok">Firmada</span>' : '<span class="pill pill-warn">Sin firmar</span>')}</button>` }));
  pendientesReservas(J).forEach(rv => filas.push({ h: rv.hora_inicio || '99', html: `<button class="riel-fila" onclick="abrirIniciar({alumno_id:${rv.alumno_id},vehiculo_id:${rv.vehiculo_id || 'null'},n_clases:${nDeReserva(rv)}})"><span class="fila-hora">${esc(rv.hora_inicio || '--:--')}</span><div style="flex:1;min-width:0"><div class="fila-tit" style="font-size:16px">${esc(rv.alumno_nombre || 'Alumno')}</div><div class="fila-sub">${esc(rv.nota || 'Programada')}</div></div></button>` }));
  filas.sort((a, b) => a.h.localeCompare(b.h));
  document.getElementById('riel-lista').innerHTML = filas.length ? filas.map(f => f.html).join('') : '<div class="vacio">Sin clases hoy.</div>';
  document.getElementById('riel-pie').innerHTML = `<span><b class="mono" style="color:var(--ink)">${miles(r.km)}</b> km hoy</span><span>${r.firmadas} de ${r.cerradas.length} firmadas</span>`;
}
window.addEventListener('resize', renderRiel);

// ─── ARRANQUE ────────────────────────────────────────────────────────────────
checkSession().catch(() => mostrarLogin());
</script>
