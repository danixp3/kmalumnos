// DNI / NIE: la letra de control tiene que cuadrar con el número (como el escritorio)
const LETRAS_DNI = 'TRWAGMYFPDXBNJZSQVHLCKE';
function problemaDni(texto) {
  const d = String(texto || '').toUpperCase().replace(/[\s.\-_/]/g, '');
  if (!d) return null;
  let r = d.match(/^(\d{1,8})([A-Z])$/);
  if (r) { const n = r[1].padStart(8, '0'), l = LETRAS_DNI[parseInt(n, 10) % 23]; return l === r[2] ? null : { msg: `La letra no corresponde: sería ${n}${l}`, bueno: n + l }; }
  r = d.match(/^(\d{8})$/);
  if (r) { const l = LETRAS_DNI[parseInt(r[1], 10) % 23]; return { msg: `Falta la letra: sería ${r[1]}${l}`, bueno: r[1] + l }; }
  r = d.match(/^([XYZ])(\d{7})([A-Z])$/);
  if (r) { const l = LETRAS_DNI[parseInt('XYZ'.indexOf(r[1]) + r[2], 10) % 23]; return l === r[3] ? null : { msg: `La letra no corresponde: sería ${r[1]}${r[2]}${l}`, bueno: r[1] + r[2] + l }; }
  return null; // pasaporte u otro documento: no se juzga
}
function pintarAvisoDni(alSalir) {
  const inp = document.getElementById('n-dni'), av = document.getElementById('n-dni-aviso');
  if (!inp || !av) return;
  const limpio = inp.value.toUpperCase().replace(/[\s.\-_/]/g, '');
  const p = (alSalir || limpio.length >= 9) ? problemaDni(inp.value) : null;
  av.innerHTML = p ? `${esc(p.msg)} <button type="button" class="lnk" onclick="document.getElementById('n-dni').value='${esc(p.bueno)}';pintarAvisoDni(true)">Corregir</button>` : '';
  inp.classList.toggle('campo-mal', !!p);
}
async function crearAlumno(forzar = false) {
  const val = id => document.getElementById(id).value.replace(/\s+/g, ' ').trim();
  const nombre = val('n-nombre'), ape1 = val('n-ape1'), ape2 = val('n-ape2'); const err = document.getElementById('n-error');
  if (!nombre) { err.textContent = 'Introduce el nombre del alumno.'; document.getElementById('n-nombre').focus(); return; }
  if (!ape1) { err.textContent = 'Introduce el primer apellido.'; document.getElementById('n-ape1').focus(); return; }
  const malDni = problemaDni(val('n-dni'));
  if (!forzar && malDni && !confirm(`El DNI parece mal escrito: ${malDni.msg}.\n\nPulsa Aceptar para guardarlo tal cual o Cancelar para corregirlo.`)) { pintarAvisoDni(true); document.getElementById('n-dni').focus(); return; }
  // Nombre y apellidos escritos juntos en «Nombre»: se avisa (en el ordenador son campos distintos)
  if (!forzar && nombre.split(' ').length >= 3 && !ape2 && !confirm(`¿«${nombre}» es solo el nombre? Los apellidos van en sus casillas. Pulsa Aceptar si el nombre es así.`)) { document.getElementById('n-nombre').focus(); return; }
  err.textContent = ''; const btn = document.getElementById('btn-nuevo'); btn.disabled = true;
  try {
    const res = await postJSON('/api/crear-alumno', {
      nombre, primer_apellido: ape1, segundo_apellido: ape2, dni: val('n-dni'), telefono: val('n-tel'),
      permiso: document.getElementById('n-permiso').value, vehiculo_id: document.getElementById('n-vehiculo').value || null,
      profesor_id: document.getElementById('n-mio').checked && S.perfil ? S.perfil.id : null, hoy: fechaLocal(), forzar
    });
    const data = await res.json();
    // Ya hay un alumno igual: no se duplica salvo que se confirme que es otra persona (u otro permiso de la misma)
    if (res.status === 409 && data.codigo === 'posible_duplicado') {
      btn.disabled = false;
      const a = data.alumno || {};
      const quien = `${a.nombre || ''}${a.n_registro ? ' (nº ' + a.n_registro + ')' : ''}${a.permiso ? ', permiso ' + a.permiso : ''}`;
      if (confirm(`${data.error}\n\n${quien}\n\nNo hace falta darlo de alta otra vez: ya está en la lista de alumnos. Pulsa Aceptar solo si es OTRA persona${data.por_dni ? ' (o el mismo alumno sacándose otro permiso)' : ''}.`)) return crearAlumno(true);
      err.textContent = `Ya está dado de alta: ${quien}.`; return;
    }
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo crear el alumno');
    const conNum = data.n_registro ? ` con el nº ${data.n_registro}` : '';
    toast(data.cobros_error ? `Alumno creado${conNum}. La matrícula la anotará la oficina.` : `Alumno creado${conNum}`, 3600); await cargarBase(); go('alumnos');
  } catch (e) { if (e.message !== 'Sesión expirada') { err.textContent = e.message; btn.disabled = false; } }
}

// ─── HISTORIAL EN CALENDARIO ─────────────────────────────────────────────────
// Mes a la vista con las clases de cada día (número en la celda; ámbar si falta
// alguna firma). Tocar un día lista sus clases; tocar una clase abre su detalle
// con la firma. Se desliza a los lados para cambiar de mes.
const mesDe = iso => iso.slice(0, 7);
function ultimoDiaMes(mes) { const [y, m] = mes.split('-').map(Number); return `${mes}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`; }
function renderHistorial() {
  if (!S.cal) S.cal = { mes: mesDe(S.hoy), dia: S.hoy, filtro: (S.perfil && S.perfil.id) ? 'mias' : 'todas', cache: {} };
  pintarHistorial();
  cargarCalendario();
}
async function cargarCalendario() {
  const C = S.cal; if (!C) return;
  const clave = C.mes + '|' + C.filtro;
  if (C.cache[clave]) { pintarHistorial(); return; }
  C.cargando = true; C.error = null; pintarHistorial();
  try {
    const q = new URLSearchParams({ desde: C.mes + '-01', hasta: ultimoDiaMes(C.mes), hoy: S.hoy });
    if (C.filtro === 'mias' && S.perfil && S.perfil.id) q.set('profesor_id', S.perfil.id);
    const res = await apiFetch('/api/calendario?' + q);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cargar el historial');
    C.cache[clave] = data.practicas;
  } catch (e) { if (e.message !== 'Sesión expirada') C.error = e.message || 'No se pudo cargar el historial'; }
  C.cargando = false;
  if (S.vista === 'historial' && C.mes + '|' + C.filtro === clave) pintarHistorial();
}
function pintarHistorial() {
  const C = S.cal; const cont = document.getElementById('v-historial'); if (!C || !cont) return;
  const cargado = C.cache[C.mes + '|' + C.filtro];
  const lista = cargado || [];
  const porDia = {};
  for (const p of lista) (porDia[p.fecha] || (porDia[p.fecha] = [])).push(p);
  // Al cambiar a otro mes se enseña su último día con clases.
  if (C.autoDia && cargado) { const dias = Object.keys(porDia).sort(); C.dia = dias.length ? dias[dias.length - 1] : C.mes + '-01'; C.autoDia = false; }
  const [y, m] = C.mes.split('-').map(Number);
  const primero = (new Date(y, m - 1, 1).getDay() + 6) % 7, ndias = new Date(y, m, 0).getDate();
  let celdas = '';
  for (let i = 0; i < primero; i++) celdas += '<span></span>';
  for (let d = 1; d <= ndias; d++) {
    const iso = `${C.mes}-${String(d).padStart(2, '0')}`;
    const ps = porDia[iso] || [];
    const falta = ps.some(p => p.km > 0 && !p.firmada);
    celdas += `<button class="dia ${ps.length ? 'con' : ''} ${iso === C.dia ? 'sel' : ''} ${iso === S.hoy ? 'hoy' : ''}" onclick="elegirDiaHist('${iso}')" aria-label="${esc(fechaLarga(iso))}${ps.length ? ', ' + ps.length + (ps.length === 1 ? ' clase' : ' clases') : ''}"><b>${d}</b>${ps.length ? `<i class="${falta ? 'pend' : ''}">${ps.length}</i>` : ''}</button>`;
  }
  const cerradas = lista.filter(p => p.km > 0);
  const kmMes = cerradas.reduce((t, p) => t + p.km, 0);
  const firmadas = cerradas.filter(p => p.firmada).length;
  const delDia = porDia[C.dia] || [];
  const filtros = S.perfil && S.perfil.id ? `<div class="chips" style="margin-bottom:12px">${[['mias', 'Mis clases'], ['todas', 'Toda la autoescuela']].map(([id, tx]) => `<button class="chip ${C.filtro === id ? 'on' : ''}" style="height:42px;font-size:15.5px" onclick="filtroHist('${id}')">${tx}</button>`).join('')}</div>` : '';
  cont.innerHTML = `
    <div class="cab"><div><div class="fecha-lin">Clases hechas</div><div class="grande" style="margin-top:4px">Historial</div></div>
      <button class="avatar" onclick="menuPerfil()" aria-label="Perfil y opciones">${esc(iniciales(S.perfil ? S.perfil.nombre : '?'))}</button></div>
    ${filtros}
    <div class="card cal cal-hist" id="cal-hist">
      <div class="cal-cab"><button onclick="mesHist(-1)" aria-label="Mes anterior">${ic('chevIzq', 20)}</button>
        <div style="text-align:center"><b>${cap(MESES[m - 1])} ${y}</b><div class="fila-sub">${!cargado ? (C.error ? 'Sin datos' : 'Cargando…') : `${cerradas.length} ${cerradas.length === 1 ? 'clase' : 'clases'} · <span class="mono">${miles(kmMes)}</span> km`}</div></div>
        <button onclick="mesHist(1)" aria-label="Mes siguiente">${ic('chev', 20)}</button></div>
      <div class="cal-sem"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-dias">${celdas}</div>
      <div class="leyenda"><span><i style="background:var(--ink)"></i>Clases</span><span><i style="background:var(--amber)"></i>Falta firma</span>${cerradas.length ? `<span style="margin-left:auto;font-weight:600;color:var(--ink)">${firmadas}/${cerradas.length} firmadas</span>` : ''}</div>
    </div>
    ${C.error ? `<div class="msg msg-err">${ic('aviso', 18)}<span>${esc(C.error)} <button class="lnk" onclick="S.cal.cache={};cargarCalendario()">Reintentar</button></span></div>` : ''}
    <div class="grupo-tit"><span>${esc(C.dia === S.hoy ? 'Hoy' : fechaLarga(C.dia))}</span><span style="font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)">${delDia.length ? `${delDia.length} ${delDia.length === 1 ? 'clase' : 'clases'} · ${miles(delDia.reduce((t, p) => t + p.km, 0))} km` : ''}</span></div>
    <div class="card">${delDia.length ? delDia.map(filaHist).join('') : `<div class="vacio">${!cargado && !C.error ? 'Cargando…' : 'Sin clases este día.'}</div>`}</div>
    ${C.dia <= S.hoy && C.dia >= sumaDias(S.hoy, -DIAS_ANOTAR) ? `<button class="btn btn-sec" style="margin-top:12px" onclick="abrirAnotar({fecha:'${C.dia}',volverA:'historial'})">${ic('mas', 20)} Anotar una clase olvidada este día</button>` : ''}`;
  activarSwipeHist();
}
function estadoPill(p) {
  if (p.en_curso) return '<span class="pill pill-dark"><span class="pill-dot"></span>En curso</span>';
  if (p.sin_cerrar) return '<span class="pill pill-warn">Sin cerrar</span>';
  if (!(p.km > 0)) return '<span class="pill pill-warn">Km pendientes</span>';
  return p.firmada ? `<span class="pill pill-ok">${ic('ok', 13, 'style="stroke-width:2.6"')} Firmada</span>` : '<span class="pill pill-warn">Sin firmar</span>';
}
function filaHist(p) {
  return `<button class="fila" onclick="abrirDetalle(${p.id})"><span class="fila-hora">${esc(p.hora_inicio || '--:--')}</span>
    <div style="flex:1;min-width:0"><div class="fila-tit">${esc(p.alumno_nombre)}</div>
    <div class="fila-sub"><span class="mono">${p.km > 0 ? miles(p.km_inicial) + ' → ' + miles(p.km_final) + ' · ' + p.km + ' km' : (p.km_inicial > 0 ? 'km ' + miles(p.km_inicial) : 'Sin km')}</span>${p.matricula ? ' · ' + esc(p.matricula) : ''}</div>
    ${p.zonas && p.zonas.length ? `<div class="fila-sub">${esc(zonasTxt(p.zonas))}</div>` : ''}</div>${estadoPill(p)}</button>`;
}
function elegirDiaHist(iso) { S.cal.dia = iso; S.cal.autoDia = false; pintarHistorial(); }
function filtroHist(id) { S.cal.filtro = id; cargarCalendario(); }
function mesHist(n) {
  const [y, m] = S.cal.mes.split('-').map(Number); const d = new Date(y, m - 1 + n, 1);
  S.cal.mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  if (S.cal.mes === mesDe(S.hoy)) { S.cal.dia = S.hoy; S.cal.autoDia = false; } else S.cal.autoDia = true;
  cargarCalendario();
}
function activarSwipeHist() {
  const el = document.getElementById('cal-hist'); if (!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) mesHist(dx < 0 ? 1 : -1);
  }, { passive: true });
}

// ─── DETALLE DE UNA CLASE (con la firma) ─────────────────────────────────────
const FIRMA_VALIDA = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
async function abrirDetalle(id) {
  abrirHoja(`<div class="hoja-tit"><h3>Clase</h3><button class="cab-atras" onclick="cerrarHoja()" aria-label="Cerrar">${ic('cerrar', 22)}</button></div><div class="cargando">Cargando…</div>`);
  try {
    const res = await apiFetch('/api/practica-detalle?id=' + id);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cargar la clase');
    pintarDetalle(data.practica);
  } catch (e) {
    if (e.message !== 'Sesión expirada') abrirHoja(`<div class="hoja-tit"><h3>Clase</h3><button class="cab-atras" onclick="cerrarHoja()" aria-label="Cerrar">${ic('cerrar', 22)}</button></div><div class="vacio">${esc(e.message)}</div>`);
  }
}
function pintarDetalle(p) {
  S.detalle = p;
  const dur = p.hora_inicio && p.hora_fin ? Math.max(1, horaAMin(p.hora_fin) - horaAMin(p.hora_inicio)) : null;
  const firmable = p.km_final > 0 && !p.firma;
  const fila = (etq, val, ancho) => `<div${ancho ? ' style="grid-column:1/-1"' : ''}><div class="etq2">${etq}</div><div class="val" style="font-size:16px">${val}</div></div>`;
  abrirHoja(`<div class="hoja-tit"><h3>Clase Nº ${p.clase_n}${p.fraccion ? ` <small class="fila-sub">· ${clasesTxt(p.fraccion)}</small>` : ''}</h3><button class="cab-atras" onclick="cerrarHoja()" aria-label="Cerrar">${ic('cerrar', 22)}</button></div>
    <div class="hoja-scroll">
      <div class="card rev-grid">
        ${fila('Alumno', esc(p.alumno_nombre) + (p.permiso ? ` <small class="fila-sub">· Permiso ${esc(p.permiso)}</small>` : ''), true)}
        ${fila('Fecha', `${esc(fechaCorta(p.fecha))} ${partes(p.fecha).y}${p.tipo_detalle === 'anotada' ? ' <span class="pill" style="font-size:12px;height:22px">Anotada después</span>' : ''}`)}
        ${fila('Horario', `<span class="mono">${esc(p.hora_inicio || '--:--')}${p.hora_fin ? ' - ' + esc(p.hora_fin) : ''}</span>${dur ? ` <small class="fila-sub">(${dur} min)</small>` : ''}`)}
        ${fila('Profesor', esc(p.profesor_nombre || '—'))}
        ${fila('Vehículo', placa(p.matricula) || esc(p.vehiculo_nombre || '—'))}
        ${fila('Km', `<span class="mono">${p.km_final > 0 ? miles(p.km_inicial) + ' → ' + miles(p.km_final) : (p.km_inicial > 0 ? miles(p.km_inicial) + ' → …' : '—')}</span>`)}
        ${fila('Recorridos', `<span class="mono">${p.km} km</span>${p.tipo_detalle === 'km_auto' ? ' <span class="pill" style="font-size:12px;height:22px">Calculados por la app</span>' : ''}`)}
        ${p.zonas.length ? fila('Zonas recorridas', esc(zonasTxt(p.zonas)), true) : ''}
        ${p.trabajado.length ? fila('Qué se ha trabajado', esc(p.trabajado.join(' · ')), true) : ''}
        ${p.nota ? fila('Observación', esc(p.nota), true) : ''}
      </div>
      <div class="etq" style="margin:10px 0 4px">Firma del alumno</div>
      ${p.firma && FIRMA_VALIDA.test(p.firma)
        ? `<div class="firma-vista"><img src="${p.firma}" alt="Firma de ${esc(p.alumno_nombre)}"></div>`
        : `<div class="msg msg-warn" style="margin-top:0">${ic('aviso', 18)}<span>${p.km_final > 0 ? 'Esta clase todavía no está firmada.' : (p.km_inicial > 0 ? 'La clase no está cerrada: falta el km final.' : 'Faltan los km: se rellenan desde la oficina y después se puede firmar.')}</span></div>`}
    </div>
    ${firmable ? `<button class="btn btn-pri btn-lg" onclick="firmarDesdeDetalle()">${ic('lapiz', 18)} ${p.sesion ? `Firmar las ${p.sesion.n} clases` : 'Firmar ahora'}</button>` : ''}
    ${p.cancelable ? `<button class="btn btn-sec" style="color:var(--err)" onclick="cancelarPractica(${p.id})">Cancelar esta práctica</button>` : ''}`);
}
function firmarDesdeDetalle() {
  const p = S.detalle; if (!p) return;
  if (flujoActivo() && S.flujo.practica_id !== p.id) { toast('Termina primero la práctica en curso.'); return; }
  S.flujo = {
    practica_id: p.id, alumno_id: p.alumno_id, alumno_nombre: p.alumno_nombre, vehiculo_id: p.vehiculo_id, vehiculo_nombre: p.vehiculo_nombre, matricula: p.matricula,
    km_inicial: p.km_inicial, km_final: p.km_final, inicio_ms: Date.now(), hora_inicio: p.hora_inicio, hora_fin: p.hora_fin,
    zonas: p.zonas, trabajado: p.trabajado, observacion: '', clase_n: p.clase_n, fecha: p.fecha, cerrada: true,
    profesor_nombre: p.profesor_nombre, volverA: S.vista === 'ficha' ? 'ficha' : 'historial', practica_ids: [p.id], n_clases: p.fraccion || 1
  };
  const ses = p.sesion;
  if (ses && ses.ids.length > 1) Object.assign(S.flujo, { practica_id: ses.ids[0], practica_ids: ses.ids, n_clases: ses.n, clase_n: ses.clase_n_desde, km_inicial: ses.km_inicial, km_final: ses.km_final, hora_inicio: ses.hora_inicio || p.hora_inicio, hora_fin: ses.hora_fin || p.hora_fin });
  guardarFlujo(); cerrarHoja(); go('firma');
}
async function cancelarPractica(id) {
  const p = S.detalle;
  if (!confirm(`¿Cancelar la práctica de ${p ? p.alumno_nombre : 'este alumno'}? Se quita del historial y de los km.`)) return;
  try {
    const cuerpo = { practica_id: id, profesor_id: S.perfil ? S.perfil.id : null };
    let res = await postJSON('/api/cancelar-practica', cuerpo);
    let data = await res.json();
    if (res.status === 409 && data.codigo === 'clase_en_curso_de_otro') {
      if (!confirm(`${data.error}\n\n¿Cancelarla igualmente?`)) return;
      res = await postJSON('/api/cancelar-practica', { ...cuerpo, forzar: true }); data = await res.json();
    }
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cancelar');
    if (S.flujo && S.flujo.practica_id === id) { S.flujo = null; guardarFlujo(); }
    cerrarHoja(); toast('Práctica cancelada');
    if (S.cal) S.cal.cache = {};
    await cargarTodo();
    if (S.vista === 'historial') cargarCalendario();
    else if (S.vista === 'ficha' && S.ficha) abrirFicha(S.ficha.id);
    else if (S.vista === 'hoy') renderHoy();
    renderRiel();
  } catch (e) { if (e.message !== 'Sesión expirada') toast(e.message); }
}

// ─── RIEL DE TABLET (jornada siempre a la vista) ─────────────────────────────
function renderRiel() {
  const cab = document.getElementById('riel-cab'); if (!cab || !window.matchMedia('(min-width:900px)').matches) return;
  const J = S.jornadaHoy;
  const r = resumenJornada(J);
  cab.innerHTML = `<div style="display:flex;align-items:flex-start;justify-content:space-between"><div><div class="fecha-lin">${esc(fechaLarga(S.hoy))}</div><div class="grande" style="margin-top:4px">Hoy</div>
    ${vehiculo(S.vehId) ? `<div style="margin-top:8px;display:flex;align-items:center;gap:8px">${placa(vehiculo(S.vehId).matricula)}<span class="fila-sub">${esc(vehiculo(S.vehId).nombre)} · <b class="mono" style="color:var(--ink)">${miles(kmSugerido(S.vehId))}</b> km</span></div>` : ''}</div>
    <button class="avatar" onclick="menuPerfil()" aria-label="Perfil y opciones">${esc(iniciales(S.perfil ? S.perfil.nombre : '?'))}</button></div>`;
  const filas = [];
  [...J.practicas.filter(p => !(p.km_final > 0)), ...agruparSesiones(J.practicas.filter(p => p.km_final > 0))].forEach(p => filas.push({ h: p.hora_inicio || '99', html: `<button class="riel-fila ${S.flujo && (esMiFlujo(p) || (S.flujo.practica_ids || []).includes(p.id)) && ['curso', 'kmfinal', 'firma'].includes(S.vista) ? 'activa' : ''}" onclick="continuarPractica(${p.id})"><span class="fila-hora">${esc(p.hora_inicio || '--:--')}</span><div style="flex:1;min-width:0"><div class="fila-tit" style="font-size:16px">${esc(p.alumno_nombre)}</div><div class="fila-sub">${p.en_curso ? 'en curso' : (p.n !== 1 ? clasesTxt(p.n) + ' · ' : '') + p.km + ' km'}</div></div>${p.en_curso ? '<span class="pill pill-dark">En curso</span>' : (p.local ? '<span class="pill pill-info">Por enviar</span>' : p.firmada ? '<span class="pill pill-ok">Firmada</span>' : '<span class="pill pill-warn">Sin firmar</span>')}</button>` }));
  pendientesReservas(J).forEach(rv => filas.push({ h: rv.hora_inicio || '99', html: `<button class="riel-fila" onclick="abrirIniciar({alumno_id:${rv.alumno_id},vehiculo_id:${rv.vehiculo_id || 'null'},n_clases:${nDeReserva(rv)}})"><span class="fila-hora">${esc(rv.hora_inicio || '--:--')}</span><div style="flex:1;min-width:0"><div class="fila-tit" style="font-size:16px">${esc(rv.alumno_nombre || 'Alumno')}</div><div class="fila-sub">${esc(rv.nota || 'Programada')}</div></div></button>` }));
  filas.sort((a, b) => a.h.localeCompare(b.h));
  document.getElementById('riel-lista').innerHTML = filas.length ? filas.map(f => f.html).join('') : '<div class="vacio">Sin clases hoy.</div>';
  document.getElementById('riel-pie').innerHTML = `<span><b class="mono" style="color:var(--ink)">${miles(r.km)}</b> km hoy</span><span>${r.firmadas} de ${r.cerradas.length} firmadas</span>`;
}
window.addEventListener('resize', renderRiel);

// ─── ARRANQUE ────────────────────────────────────────────────────────────────
aplicarTema();
checkSession().catch(() => mostrarLogin());
</script>
